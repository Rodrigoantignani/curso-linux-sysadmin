<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="730" viewBox="0 0 1400 730" role="img" aria-labelledby="titulo desc">
  <title id="titulo">SSH decide se você entra; sudo decide o que você faz</title>
  <desc id="desc">Duas portas, duas listas, dois logs</desc>
  <style>
    .bg { fill: #f6f4ee; }
    .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 40px; font-weight: 700; fill: #14213d; }
    .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 19px; fill: #5b6472; }
    .h2 { font-family: 'Segoe UI', Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #14213d; }
    .card { fill: #ffffff; stroke: #d8d5cc; stroke-width: 1.5; }
    .step-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #14213d; }
    .step-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .small { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #5b6472; }
    .body { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #2b3240; }
    .mono { font-family: 'Cascadia Code', Consolas, monospace; font-size: 14px; fill: #2563eb; }
    .term { font-family: 'Cascadia Code', Consolas, monospace; font-size: 15px; fill: #e2e8f0; }
    .term-title { font-family: 'Cascadia Code', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #ffffff; }
    .num { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
    .foot { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .foot-strong { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #14213d; }
    .arrow { stroke: #8b93a1; stroke-width: 2.5; fill: none; }
    .tag { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b93a1"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="730"/>
  <text class="title" x="60" y="62">SSH decide se você entra; sudo decide o que você faz</text>
  <text class="subtitle" x="60" y="98">Duas portas, duas listas, dois logs</text>

  <rect class="card" x="60" y="156" width="620" height="464" rx="16"/>
  <rect x="60" y="156" width="620" height="64" rx="16" fill="#7c3aed" opacity="0.10"/>
  <rect x="60" y="204" width="620" height="16" fill="#7c3aed" opacity="0.10"/>
  <text class="h2" x="84" y="196">Porta 1 · entrar (SSH)</text>
  <text class="small" x="84" y="244">confere quem você é e de onde vem</text>
  <circle cx="90" cy="267" r="5" fill="#7c3aed"/>
  <text class="body" x="106" y="272" style="font-weight:700">chave privada</text>
  <text class="small" x="106" y="294">fica com você; nunca sai do seu computador</text>
  <circle cx="90" cy="322" r="5" fill="#7c3aed"/>
  <text class="body" x="106" y="327" style="font-weight:700">chave pública</text>
  <text class="small" x="106" y="349">vai para o ~/.ssh/authorized_keys do servidor</text>
  <circle cx="90" cy="377" r="5" fill="#7c3aed"/>
  <text class="body" x="106" y="382" style="font-weight:700">known_hosts</text>
  <text class="small" x="106" y="404">você confere a identidade do servidor</text>
  <circle cx="90" cy="432" r="5" fill="#7c3aed"/>
  <text class="body" x="106" y="437" style="font-weight:700">sshd_config</text>
  <text class="small" x="106" y="459">decide se aceita chave, senha ou root direto</text>
  <rect class="card" x="720" y="156" width="620" height="464" rx="16"/>
  <rect x="720" y="156" width="620" height="64" rx="16" fill="#7c3aed" opacity="0.10"/>
  <rect x="720" y="204" width="620" height="16" fill="#7c3aed" opacity="0.10"/>
  <text class="h2" x="744" y="196">Porta 2 · mandar (sudo)</text>
  <text class="small" x="744" y="244">confere o que você pode fazer como root</text>
  <circle cx="750" cy="267" r="5" fill="#7c3aed"/>
  <text class="body" x="766" y="272" style="font-weight:700">sudo -l</text>
  <text class="small" x="766" y="294">mostra suas regras antes de usar</text>
  <circle cx="750" cy="322" r="5" fill="#7c3aed"/>
  <text class="body" x="766" y="327" style="font-weight:700">sudo comando</text>
  <text class="small" x="766" y="349">roda só um comando como root e anota no log</text>
  <circle cx="750" cy="377" r="5" fill="#7c3aed"/>
  <text class="body" x="766" y="382" style="font-weight:700">sudo -i</text>
  <text class="small" x="766" y="404">vira root de verdade; o log diz &#x27;root fez&#x27;</text>
  <circle cx="750" cy="432" r="5" fill="#7c3aed"/>
  <text class="body" x="766" y="437" style="font-weight:700">/etc/sudoers.d</text>
  <text class="small" x="766" y="459">regras novas, sempre com visudo</text>
  <line x1="60" y1="666" x2="1340" y2="666" stroke="#d8d5cc" stroke-width="1"/>
  <text class="foot" x="60" y="700">Entrar não é o mesmo que mandar. Um usuário pode entrar por SSH e não ter sudo nenhum. Cada porta escreve no log por que disse não.</text>
</svg>
