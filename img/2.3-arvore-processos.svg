<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="736" viewBox="0 0 1400 736" role="img" aria-labelledby="titulo desc">
  <title id="titulo">A árvore de processos</title>
  <desc id="desc">Todo processo é filho de outro: PID, PPID, dono, estado e uma caixa de sinais</desc>
  <style>
    .bg { fill: #f6f4ee; }
    .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 40px; font-weight: 700; fill: #14213d; }
    .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 19px; fill: #5b6472; }
    .h2 { font-family: 'Segoe UI', Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #14213d; }
    .card { fill: #ffffff; stroke: #d8d5cc; stroke-width: 1.5; }
    .step-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #14213d; }
    .step-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .small { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #5b6472; }
    .body { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #2b3240; }
    .mono { font-family: 'Cascadia Code', Consolas, monospace; font-size: 14px; fill: #2563eb; }
    .term { font-family: 'Cascadia Code', Consolas, monospace; font-size: 15px; fill: #e2e8f0; }
    .term-title { font-family: 'Cascadia Code', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #ffffff; }
    .num { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
    .foot { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .foot-strong { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #14213d; }
    .arrow { stroke: #8b93a1; stroke-width: 2.5; fill: none; }
    .tag { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b93a1"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="736"/>
  <text class="title" x="60" y="62">A árvore de processos</text>
  <text class="subtitle" x="60" y="98">Todo processo é filho de outro: PID, PPID, dono, estado e uma caixa de sinais</text>

  <rect class="card" x="60" y="156" width="700" height="290" rx="14"/>
  <path d="M60 170 a14 14 0 0 1 14 -14 h672 a14 14 0 0 1 14 14 v46 h-700 z" fill="#14213d"/>
  <text class="term-title" x="86" y="192">systemd (PID 1)</text>
  <rect x="60" y="216" width="700" height="4" fill="#2563eb"/>
  <text class="term" x="88" y="248">systemd (PID 1)          &lt;- o avô de todos; adota os órfãos</text>
  <text class="term" x="88" y="275"> ├─ sshd                 &lt;- serviço</text>
  <text class="term" x="88" y="302"> │   └─ sshd: rodrigo    &lt;- a sua conexão</text>
  <text class="term" x="88" y="329"> │       └─ bash         &lt;- o seu shell</text>
  <text class="term" x="88" y="356"> │           ├─ sleep 600 &amp;</text>
  <text class="term" x="88" y="383"> │           └─ ps -ef --forest</text>
  <text class="term" x="88" y="410"> ├─ chronyd</text>
  <text class="term" x="88" y="437"> └─ crond</text>
  <rect class="card" x="800" y="156" width="540" height="470" rx="16"/>
  <rect x="800" y="156" width="8" height="470" rx="4" fill="#2563eb"/>
  <text class="h2" x="828" y="194">Quatro ideias</text>
  <circle cx="834" cy="225" r="6" fill="#2563eb"/>
  <text class="body" x="852" y="230" style="font-weight:700">Árvore</text>
  <text class="small" x="852" y="254">Todo processo nasce de outro (fork); o primeiro é o systemd, PID 1.</text>
  <text class="small" x="852" y="274">Matar o pai pode levar os filhos junto ou deixá-los órfãos.</text>
  <circle cx="834" cy="305" r="6" fill="#2563eb"/>
  <text class="body" x="852" y="310" style="font-weight:700">Estado</text>
  <text class="small" x="852" y="334">R rodando, S dormindo, D preso no disco (nem o -9 resolve), T</text>
  <text class="small" x="852" y="354">parado, Z zumbi.</text>
  <circle cx="834" cy="385" r="6" fill="#2563eb"/>
  <text class="body" x="852" y="390" style="font-weight:700">Sinal</text>
  <text class="small" x="852" y="414">15 pede para sair, 9 mata, 1 avisa que o terminal sumiu. O processo</text>
  <text class="small" x="852" y="434">pode tratar 15 e 1; o 9 o kernel aplica direto.</text>
  <circle cx="834" cy="465" r="6" fill="#2563eb"/>
  <text class="body" x="852" y="470" style="font-weight:700">Registro</text>
  <text class="small" x="852" y="494">O que o processo escreve na saída de erro e o que o kernel e o</text>
  <text class="small" x="852" y="514">systemd veem vai para o journal. Sem disco, sumiu no boot.</text>
  <line x1="60" y1="672" x2="1340" y2="672" stroke="#d8d5cc" stroke-width="1"/>
  <text class="foot" x="60" y="706">Se o boot parou ou o serviço caiu, olhe a árvore e o estado antes de matar: o PID certo e o sinal certo resolvem; o -9 esconde a causa.</text>
</svg>
