<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="596" viewBox="0 0 1400 596" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Duas portas: entrar e mandar</title>
  <desc id="desc">O SSH decide se você entra; o sudo decide o que você pode fazer depois</desc>
  <style>
    .bg { fill: #f6f4ee; }
    .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 40px; font-weight: 700; fill: #14213d; }
    .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 19px; fill: #5b6472; }
    .h2 { font-family: 'Segoe UI', Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #14213d; }
    .card { fill: #ffffff; stroke: #d8d5cc; stroke-width: 1.5; }
    .step-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #14213d; }
    .step-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .small { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #5b6472; }
    .body { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #2b3240; }
    .mono { font-family: 'Cascadia Code', Consolas, monospace; font-size: 14px; fill: #2563eb; }
    .term { font-family: 'Cascadia Code', Consolas, monospace; font-size: 15px; fill: #e2e8f0; }
    .term-title { font-family: 'Cascadia Code', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #ffffff; }
    .num { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
    .foot { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .foot-strong { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #14213d; }
    .arrow { stroke: #8b93a1; stroke-width: 2.5; fill: none; }
    .tag { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b93a1"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="596"/>
  <text class="title" x="60" y="62">Duas portas: entrar e mandar</text>
  <text class="subtitle" x="60" y="98">O SSH decide se você entra; o sudo decide o que você pode fazer depois</text>

  <rect class="card" x="60" y="176" width="235" height="300" rx="14"/>
  <rect x="60" y="176" width="235" height="10" rx="5" fill="#7c3aed"/>
  <circle cx="90" cy="222" r="17" fill="#7c3aed"/>
  <text class="num" x="90" y="227" text-anchor="middle">1</text>
  <text class="step-title" x="116" y="222" style="font-size:18px">Chave privada</text>
  <text class="small" x="76" y="272">Fica no seu computador e nunca</text>
  <text class="small" x="76" y="291">sai. Assina o desafio que o</text>
  <text class="small" x="76" y="310">servidor manda.</text>
  <rect x="76" y="434" width="203" height="26" rx="13" fill="#7c3aed" opacity="0.12"/>
  <text class="small" x="88" y="452" style="font-weight:700;fill:#7c3aed">seu lado</text>
  <line class="arrow" x1="297" y1="326.0" x2="317" y2="326.0" marker-end="url(#seta)"/>
  <rect class="card" x="321" y="176" width="235" height="300" rx="14"/>
  <rect x="321" y="176" width="235" height="10" rx="5" fill="#7c3aed"/>
  <circle cx="351" cy="222" r="17" fill="#7c3aed"/>
  <text class="num" x="351" y="227" text-anchor="middle">2</text>
  <text class="step-title" x="377" y="222" style="font-size:18px">sshd</text>
  <text class="small" x="337" y="272">Confere a assinatura com a</text>
  <text class="small" x="337" y="291">pública do authorized_keys e</text>
  <text class="small" x="337" y="310">aplica o sshd_config.</text>
  <rect x="337" y="434" width="203" height="26" rx="13" fill="#7c3aed" opacity="0.12"/>
  <text class="small" x="349" y="452" style="font-weight:700;fill:#7c3aed">porta 22</text>
  <line class="arrow" x1="558" y1="326.0" x2="578" y2="326.0" marker-end="url(#seta)"/>
  <rect class="card" x="582" y="176" width="235" height="300" rx="14"/>
  <rect x="582" y="176" width="235" height="10" rx="5" fill="#7c3aed"/>
  <circle cx="612" cy="222" r="17" fill="#7c3aed"/>
  <text class="num" x="612" y="227" text-anchor="middle">3</text>
  <text class="step-title" x="638" y="222" style="font-size:18px">Sessão rodrigo</text>
  <text class="small" x="598" y="272">Você entrou. O journal e o</text>
  <text class="small" x="598" y="291">/var/log/secure registram o</text>
  <text class="small" x="598" y="310">método e a origem.</text>
  <rect x="598" y="434" width="203" height="26" rx="13" fill="#7c3aed" opacity="0.12"/>
  <text class="small" x="610" y="452" style="font-weight:700;fill:#7c3aed">UID comum</text>
  <line class="arrow" x1="820" y1="326.0" x2="840" y2="326.0" marker-end="url(#seta)"/>
  <rect class="card" x="844" y="176" width="235" height="300" rx="14"/>
  <rect x="844" y="176" width="235" height="10" rx="5" fill="#7c3aed"/>
  <circle cx="874" cy="222" r="17" fill="#7c3aed"/>
  <text class="num" x="874" y="227" text-anchor="middle">4</text>
  <text class="step-title" x="900" y="222" style="font-size:18px">sudoers</text>
  <text class="small" x="860" y="272">Uma lista separada decide quais</text>
  <text class="small" x="860" y="291">comandos rodrigo pode rodar</text>
  <text class="small" x="860" y="310">como root.</text>
  <rect x="860" y="434" width="203" height="26" rx="13" fill="#7c3aed" opacity="0.12"/>
  <text class="small" x="872" y="452" style="font-weight:700;fill:#7c3aed">visudo</text>
  <line class="arrow" x1="1081" y1="326.0" x2="1101" y2="326.0" marker-end="url(#seta)"/>
  <rect class="card" x="1105" y="176" width="235" height="300" rx="14"/>
  <rect x="1105" y="176" width="235" height="10" rx="5" fill="#7c3aed"/>
  <circle cx="1135" cy="222" r="17" fill="#7c3aed"/>
  <text class="num" x="1135" y="227" text-anchor="middle">5</text>
  <text class="step-title" x="1161" y="222" style="font-size:18px">root</text>
  <text class="small" x="1121" y="272">Só agora o comando roda com UID</text>
  <text class="small" x="1121" y="291">0. Cada porta grava por que</text>
  <text class="small" x="1121" y="310">disse não.</text>
  <rect x="1121" y="434" width="203" height="26" rx="13" fill="#7c3aed" opacity="0.12"/>
  <text class="small" x="1133" y="452" style="font-weight:700;fill:#7c3aed">UID 0</text>
  <line x1="60" y1="532" x2="1340" y2="532" stroke="#d8d5cc" stroke-width="1"/>
  <text class="foot" x="60" y="566">As duas portas têm listas e logs próprios. Entrar não é o mesmo que mandar: um usuário pode entrar por SSH e não ter sudo nenhum.</text>
</svg>
