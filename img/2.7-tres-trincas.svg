<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="914" viewBox="0 0 1400 914" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Quem pergunta primeiro vence</title>
  <desc id="desc">O kernel usa uma trinca só: dono, senão grupo, senão outros — e para na primeira que casa</desc>
  <style>
    .bg { fill: #f6f4ee; }
    .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 40px; font-weight: 700; fill: #14213d; }
    .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 19px; fill: #5b6472; }
    .h2 { font-family: 'Segoe UI', Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #14213d; }
    .card { fill: #ffffff; stroke: #d8d5cc; stroke-width: 1.5; }
    .step-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #14213d; }
    .step-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .small { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #5b6472; }
    .body { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #2b3240; }
    .mono { font-family: 'Cascadia Code', Consolas, monospace; font-size: 14px; fill: #2563eb; }
    .term { font-family: 'Cascadia Code', Consolas, monospace; font-size: 15px; fill: #e2e8f0; }
    .term-title { font-family: 'Cascadia Code', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #ffffff; }
    .num { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
    .foot { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .foot-strong { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #14213d; }
    .arrow { stroke: #8b93a1; stroke-width: 2.5; fill: none; }
    .tag { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b93a1"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="914"/>
  <text class="title" x="60" y="62">Quem pergunta primeiro vence</text>
  <text class="subtitle" x="60" y="98">O kernel usa uma trinca só: dono, senão grupo, senão outros — e para na primeira que casa</text>

  <rect class="card" x="60" y="156" width="620" height="648" rx="16"/>
  <rect x="60" y="156" width="620" height="64" rx="16" fill="#059669" opacity="0.10"/>
  <rect x="60" y="204" width="620" height="16" fill="#059669" opacity="0.10"/>
  <text class="h2" x="84" y="196">Anatomia de -rwxr-x---</text>
  <text class="small" x="84" y="244">um arquivo, lido da esquerda para a direita</text>
  <circle cx="90" cy="267" r="5" fill="#059669"/>
  <text class="body" x="106" y="272" style="font-weight:700">Tipo</text>
  <text class="small" x="106" y="294">— arquivo · d pasta · l link</text>
  <circle cx="90" cy="322" r="5" fill="#059669"/>
  <text class="body" x="106" y="327" style="font-weight:700">Dono: rwx = 7</text>
  <text class="small" x="106" y="349">ler, escrever e executar</text>
  <circle cx="90" cy="377" r="5" fill="#059669"/>
  <text class="body" x="106" y="382" style="font-weight:700">Grupo: r-x = 5</text>
  <text class="small" x="106" y="404">ler e executar, sem escrever</text>
  <circle cx="90" cy="432" r="5" fill="#059669"/>
  <text class="body" x="106" y="437" style="font-weight:700">Outros: --- = 0</text>
  <text class="small" x="106" y="459">ninguém de fora entra</text>
  <circle cx="90" cy="487" r="5" fill="#059669"/>
  <text class="body" x="106" y="492" style="font-weight:700">Octal: 750</text>
  <text class="small" x="106" y="514">4+2+1 · 4+0+1 · 0</text>
  <circle cx="90" cy="542" r="5" fill="#059669"/>
  <text class="body" x="106" y="547" style="font-weight:700">Sufixos</text>
  <text class="small" x="106" y="569">. = contexto SELinux · + = ACL</text>
  <rect class="card" x="720" y="156" width="620" height="648" rx="16"/>
  <rect x="720" y="156" width="620" height="64" rx="16" fill="#059669" opacity="0.10"/>
  <rect x="720" y="204" width="620" height="16" fill="#059669" opacity="0.10"/>
  <text class="h2" x="744" y="196">Quem está pedindo?</text>
  <text class="small" x="744" y="244">a primeira pergunta que casa decide</text>
  <circle cx="750" cy="267" r="5" fill="#059669"/>
  <text class="body" x="766" y="272" style="font-weight:700">É o dono?</text>
  <text class="small" x="766" y="294">usa rwx e para aqui.</text>
  <circle cx="750" cy="322" r="5" fill="#059669"/>
  <text class="body" x="766" y="327" style="font-weight:700">Está no grupo?</text>
  <text class="small" x="766" y="349">usa r-x e para aqui.</text>
  <circle cx="750" cy="377" r="5" fill="#059669"/>
  <text class="body" x="766" y="382" style="font-weight:700">Não é nenhum dos dois?</text>
  <text class="small" x="766" y="404">usa --- e para aqui.</text>
  <circle cx="750" cy="432" r="5" fill="#059669"/>
  <text class="body" x="766" y="437" style="font-weight:700">Numa pasta</text>
  <text class="small" x="766" y="459">r lista nomes, w cria/apaga/renomeia, x deixa atravessar.</text>
  <circle cx="750" cy="487" r="5" fill="#059669"/>
  <text class="body" x="766" y="492" style="font-weight:700">Numa pasta, w manda</text>
  <text class="small" x="766" y="514">apagar depende da permissão da pasta, não do arquivo.</text>
  <line x1="60" y1="850" x2="1340" y2="850" stroke="#d8d5cc" stroke-width="1"/>
  <text class="foot" x="60" y="884">A primeira trinca que casa decide; as outras nem são olhadas. As mesmas letras significam coisas diferentes em arquivo e em pasta.</text>
</svg>
