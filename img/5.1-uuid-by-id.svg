<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="656" viewBox="0 0 1400 656" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Não confie em sda e sdb</title>
  <desc id="desc">Use UUID ou /dev/disk/by-id; a ordem dos discos pode mudar</desc>
  <style>
    .bg { fill: #f6f4ee; }
    .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 40px; font-weight: 700; fill: #14213d; }
    .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 19px; fill: #5b6472; }
    .h2 { font-family: 'Segoe UI', Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #14213d; }
    .card { fill: #ffffff; stroke: #d8d5cc; stroke-width: 1.5; }
    .step-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #14213d; }
    .step-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .small { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #5b6472; }
    .body { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #2b3240; }
    .mono { font-family: 'Cascadia Code', Consolas, monospace; font-size: 14px; fill: #2563eb; }
    .term { font-family: 'Cascadia Code', Consolas, monospace; font-size: 15px; fill: #e2e8f0; }
    .term-title { font-family: 'Cascadia Code', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #ffffff; }
    .num { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
    .foot { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .foot-strong { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #14213d; }
    .arrow { stroke: #8b93a1; stroke-width: 2.5; fill: none; }
    .tag { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b93a1"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="656"/>
  <text class="title" x="60" y="62">Não confie em sda e sdb</text>
  <text class="subtitle" x="60" y="98">Use UUID ou /dev/disk/by-id; a ordem dos discos pode mudar</text>

  <rect class="card" x="60" y="156" width="700" height="182" rx="14"/>
  <path d="M60 170 a14 14 0 0 1 14 -14 h672 a14 14 0 0 1 14 14 v46 h-700 z" fill="#14213d"/>
  <text class="term-title" x="86" y="192">lsblk -f</text>
  <rect x="60" y="216" width="700" height="4" fill="#0891b2"/>
  <text class="term" x="88" y="248">NAME   FSTYPE FSVER LABEL UUID                                 FSAVAIL FSUSE% MOUNTPOINTS</text>
  <text class="term" x="88" y="275">sda                                         3f1a2b4c-...   5.2G     12% /</text>
  <text class="term" x="88" y="302">sdb                                         7e8f9a0b-...   1.0G      0% </text>
  <text class="term" x="88" y="329">sr0                                     iso9660 2026-11-05-...   0B   100% /run/media/student/ISO</text>
  <rect class="card" x="800" y="156" width="540" height="390" rx="16"/>
  <rect x="800" y="156" width="8" height="390" rx="4" fill="#0891b2"/>
  <text class="h2" x="828" y="194">Onde olhar</text>
  <circle cx="834" cy="225" r="6" fill="#0891b2"/>
  <text class="body" x="852" y="230" style="font-weight:700">lsblk -f</text>
  <text class="small" x="852" y="254">lista discos, UUID e ponto de montagem</text>
  <circle cx="834" cy="285" r="6" fill="#0891b2"/>
  <text class="body" x="852" y="290" style="font-weight:700">/dev/disk/by-id</text>
  <text class="small" x="852" y="314">nomes estáveis, independente da ordem</text>
  <circle cx="834" cy="345" r="6" fill="#0891b2"/>
  <text class="body" x="852" y="350" style="font-weight:700">/dev/disk/by-uuid</text>
  <text class="small" x="852" y="374">acesso direto pelo UUID</text>
  <circle cx="834" cy="405" r="6" fill="#0891b2"/>
  <text class="body" x="852" y="410" style="font-weight:700">dmesg | tail</text>
  <text class="small" x="852" y="434">o que o kernel viu na chegada do disco</text>
  <circle cx="834" cy="465" r="6" fill="#0891b2"/>
  <text class="body" x="852" y="470" style="font-weight:700">blkid</text>
  <text class="small" x="852" y="494">mostra UUID e tipo de sistema de arquivos</text>
  <line x1="60" y1="592" x2="1340" y2="592" stroke="#d8d5cc" stroke-width="1"/>
  <text class="foot" x="60" y="626">A ordem sda/sdb muda se você adicionar ou remover um disco. No fstab, use UUID ou by-id, nunca o nome do dispositivo.</text>
</svg>
