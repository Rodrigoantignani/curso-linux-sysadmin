<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="536" viewBox="0 0 1400 536" role="img" aria-labelledby="titulo desc">
  <title id="titulo">O loader procura pelo soname</title>
  <desc id="desc">Não pelo arquivo com versão: ldconfig recria o symlink</desc>
  <style>
    .bg { fill: #f6f4ee; }
    .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 40px; font-weight: 700; fill: #14213d; }
    .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 19px; fill: #5b6472; }
    .h2 { font-family: 'Segoe UI', Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #14213d; }
    .card { fill: #ffffff; stroke: #d8d5cc; stroke-width: 1.5; }
    .step-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #14213d; }
    .step-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .small { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #5b6472; }
    .body { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #2b3240; }
    .mono { font-family: 'Cascadia Code', Consolas, monospace; font-size: 14px; fill: #2563eb; }
    .term { font-family: 'Cascadia Code', Consolas, monospace; font-size: 15px; fill: #e2e8f0; }
    .term-title { font-family: 'Cascadia Code', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #ffffff; }
    .num { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
    .foot { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .foot-strong { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #14213d; }
    .arrow { stroke: #8b93a1; stroke-width: 2.5; fill: none; }
    .tag { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b93a1"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="536"/>
  <text class="title" x="60" y="62">O loader procura pelo soname</text>
  <text class="subtitle" x="60" y="98">Não pelo arquivo com versão: ldconfig recria o symlink</text>

  <rect class="card" x="60" y="156" width="700" height="182" rx="14"/>
  <path d="M60 170 a14 14 0 0 1 14 -14 h672 a14 14 0 0 1 14 14 v46 h-700 z" fill="#14213d"/>
  <text class="term-title" x="86" y="192">ldd ./app</text>
  <rect x="60" y="216" width="700" height="4" fill="#dc2626"/>
  <text class="term" x="88" y="248">linux-vdso.so.1 =&gt;  (0x0000...)</text>
  <text class="term" x="88" y="275">libola.so.1 =&gt; /opt/ola/lib/libola.so.1 (0x0000...)</text>
  <text class="term" x="88" y="302">libc.so.6 =&gt; /lib64/libc.so.6 (0x0000...)</text>
  <text class="term" x="88" y="329">/lib64/ld-linux-x86-64.so.2 (0x0000...)</text>
  <rect class="card" x="800" y="156" width="540" height="270" rx="16"/>
  <rect x="800" y="156" width="8" height="270" rx="4" fill="#dc2626"/>
  <text class="h2" x="828" y="194">Os três nomes</text>
  <circle cx="834" cy="225" r="6" fill="#dc2626"/>
  <text class="body" x="852" y="230" style="font-weight:700">real name</text>
  <text class="small" x="852" y="254">libola.so.1.1.0: o arquivo de verdade</text>
  <circle cx="834" cy="285" r="6" fill="#dc2626"/>
  <text class="body" x="852" y="290" style="font-weight:700">soname</text>
  <text class="small" x="852" y="314">libola.so.1: o nome gravado no programa</text>
  <circle cx="834" cy="345" r="6" fill="#dc2626"/>
  <text class="body" x="852" y="350" style="font-weight:700">linker name</text>
  <text class="small" x="852" y="374">libola.so: serve para compilar com -l</text>
  <line x1="60" y1="472" x2="1340" y2="472" stroke="#d8d5cc" stroke-width="1"/>
  <text class="foot" x="60" y="506">Se a pasta não está na lista e ninguém rodou ldconfig, o loader não acha, mesmo com o arquivo lá. Soname diferente = interface diferente.</text>
</svg>
