<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="694" viewBox="0 0 1400 694" role="img" aria-labelledby="titulo desc">
  <title id="titulo">isolate muda o target agora</title>
  <desc id="desc">Emergency, rescue, multi-user e graphical: cada um desliga o que não precisa</desc>
  <style>
    .bg { fill: #f6f4ee; }
    .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 40px; font-weight: 700; fill: #14213d; }
    .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 19px; fill: #5b6472; }
    .h2 { font-family: 'Segoe UI', Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #14213d; }
    .card { fill: #ffffff; stroke: #d8d5cc; stroke-width: 1.5; }
    .step-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #14213d; }
    .step-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .small { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #5b6472; }
    .body { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #2b3240; }
    .mono { font-family: 'Cascadia Code', Consolas, monospace; font-size: 14px; fill: #2563eb; }
    .term { font-family: 'Cascadia Code', Consolas, monospace; font-size: 15px; fill: #e2e8f0; }
    .term-title { font-family: 'Cascadia Code', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #ffffff; }
    .num { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
    .foot { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .foot-strong { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #14213d; }
    .arrow { stroke: #8b93a1; stroke-width: 2.5; fill: none; }
    .tag { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b93a1"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="694"/>
  <text class="title" x="60" y="62">isolate muda o target agora</text>
  <text class="subtitle" x="60" y="98">Emergency, rescue, multi-user e graphical: cada um desliga o que não precisa</text>

  <path class="arrow" d="M46 574 V178" marker-end="url(#seta)"/>
  <text class="small" x="18" y="148" style="font-weight:700">sobe</text>
  <rect class="card" x="70" y="160" width="1300" height="96" rx="12"/>
  <rect x="70" y="160" width="10" height="96" rx="5" fill="#7c3aed"/>
  <circle cx="112" cy="208.0" r="20" fill="#7c3aed"/>
  <text class="num" x="112" y="213.0" text-anchor="middle">3</text>
  <text class="step-title" x="150" y="194" style="font-size:20px">emergency</text>
  <text class="mono" x="150" y="222">raiz só de leitura, shell de root, sem nada</text>
  <text class="step-sub" x="470" y="200">último recurso</text>
  <text class="small" x="470" y="226">depende dos degraus de baixo</text>
  <rect class="card" x="70" y="266" width="1300" height="96" rx="12"/>
  <rect x="70" y="266" width="10" height="96" rx="5" fill="#7c3aed"/>
  <circle cx="112" cy="314.0" r="20" fill="#7c3aed"/>
  <text class="num" x="112" y="319.0" text-anchor="middle">2</text>
  <text class="step-title" x="150" y="300" style="font-size:20px">rescue</text>
  <text class="mono" x="150" y="328">discos montados, shell de root, sem rede</text>
  <text class="step-sub" x="470" y="306">manutenção</text>
  <text class="small" x="470" y="332">depende dos degraus de baixo</text>
  <rect class="card" x="70" y="372" width="1300" height="96" rx="12"/>
  <rect x="70" y="372" width="10" height="96" rx="5" fill="#7c3aed"/>
  <circle cx="112" cy="420.0" r="20" fill="#7c3aed"/>
  <text class="num" x="112" y="425.0" text-anchor="middle">1</text>
  <text class="step-title" x="150" y="406" style="font-size:20px">multi-user</text>
  <text class="mono" x="150" y="434">rede, sshd, todos os serviços</text>
  <text class="step-sub" x="470" y="412">servidor padrão</text>
  <text class="small" x="470" y="438">depende dos degraus de baixo</text>
  <rect class="card" x="70" y="478" width="1300" height="96" rx="12"/>
  <rect x="70" y="478" width="10" height="96" rx="5" fill="#7c3aed"/>
  <circle cx="112" cy="526.0" r="20" fill="#7c3aed"/>
  <text class="num" x="112" y="531.0" text-anchor="middle">0</text>
  <text class="step-title" x="150" y="512" style="font-size:20px">graphical</text>
  <text class="mono" x="150" y="540">tudo ligado, incluindo tela gráfica</text>
  <text class="step-sub" x="470" y="518">servidor de desktop</text>
  <text class="small" x="470" y="544">a base: se falhar, tudo acima falha</text>
  <line x1="60" y1="630" x2="1340" y2="630" stroke="#d8d5cc" stroke-width="1"/>
  <text class="foot" x="60" y="664">isolate muda agora (como start); set-default muda o próximo boot (como enable). Por SSH, nunca isole rescue ou emergency num servidor remoto.</text>
</svg>
