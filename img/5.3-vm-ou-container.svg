<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="822" viewBox="0 0 1400 822" role="img" aria-labelledby="titulo desc">
  <title id="titulo">VM e contêiner: sala alugada ou divisória</title>
  <desc id="desc">A VM tem kernel próprio; o contêiner usa o kernel do nó</desc>
  <style>
    .bg { fill: #f6f4ee; }
    .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 40px; font-weight: 700; fill: #14213d; }
    .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 19px; fill: #5b6472; }
    .h2 { font-family: 'Segoe UI', Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #14213d; }
    .card { fill: #ffffff; stroke: #d8d5cc; stroke-width: 1.5; }
    .step-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #14213d; }
    .step-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .small { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #5b6472; }
    .body { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #2b3240; }
    .mono { font-family: 'Cascadia Code', Consolas, monospace; font-size: 14px; fill: #2563eb; }
    .term { font-family: 'Cascadia Code', Consolas, monospace; font-size: 15px; fill: #e2e8f0; }
    .term-title { font-family: 'Cascadia Code', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #ffffff; }
    .num { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
    .foot { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .foot-strong { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #14213d; }
    .arrow { stroke: #8b93a1; stroke-width: 2.5; fill: none; }
    .tag { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b93a1"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="822"/>
  <text class="title" x="60" y="62">VM e contêiner: sala alugada ou divisória</text>
  <text class="subtitle" x="60" y="98">A VM tem kernel próprio; o contêiner usa o kernel do nó</text>

  <rect class="card" x="60" y="156" width="620" height="556" rx="16"/>
  <rect x="60" y="156" width="620" height="64" rx="16" fill="#0891b2" opacity="0.10"/>
  <rect x="60" y="204" width="620" height="16" fill="#0891b2" opacity="0.10"/>
  <text class="h2" x="84" y="196">VM · sala com portaria</text>
  <text class="small" x="84" y="244">o hipervisor finge ser o hardware</text>
  <circle cx="90" cy="267" r="5" fill="#0891b2"/>
  <text class="body" x="106" y="272" style="font-weight:700">Kernel próprio</text>
  <text class="small" x="106" y="294">Cada VM sobe o seu kernel e os seus drivers.</text>
  <circle cx="90" cy="322" r="5" fill="#0891b2"/>
  <text class="body" x="106" y="327" style="font-weight:700">virtio</text>
  <text class="small" x="106" y="349">O interfone com o síndico: em vez de fingir hardware antigo, fala a língua do</text>
  <text class="small" x="106" y="368">hipervisor.</text>
  <circle cx="90" cy="396" r="5" fill="#0891b2"/>
  <text class="body" x="106" y="401" style="font-weight:700">Guest agent</text>
  <text class="small" x="106" y="423">O zelador: responde ao Proxmox quando ele pergunta o IP ou pede para desligar.</text>
  <circle cx="90" cy="451" r="5" fill="#0891b2"/>
  <text class="body" x="106" y="456" style="font-weight:700">cloud-init</text>
  <text class="small" x="106" y="478">O kit de mudança do primeiro boot: nome, usuários e chaves.</text>
  <circle cx="90" cy="506" r="5" fill="#0891b2"/>
  <text class="body" x="106" y="511" style="font-weight:700">Clone</text>
  <text class="small" x="106" y="533">Precisa de hostname, machine-id e chaves SSH novos.</text>
  <rect class="card" x="720" y="156" width="620" height="556" rx="16"/>
  <rect x="720" y="156" width="620" height="64" rx="16" fill="#0891b2" opacity="0.10"/>
  <rect x="720" y="204" width="620" height="16" fill="#0891b2" opacity="0.10"/>
  <text class="h2" x="744" y="196">Contêiner · divisória</text>
  <text class="small" x="744" y="244">isolamento sem outro kernel</text>
  <circle cx="750" cy="267" r="5" fill="#0891b2"/>
  <text class="body" x="766" y="272" style="font-weight:700">Sem kernel próprio</text>
  <text class="small" x="766" y="294">Usa o kernel do nó; compartilha a portaria.</text>
  <circle cx="750" cy="322" r="5" fill="#0891b2"/>
  <text class="body" x="766" y="327" style="font-weight:700">Isolamento</text>
  <text class="small" x="766" y="349">Namespaces e cgroups separam processos, rede e limites.</text>
  <circle cx="750" cy="377" r="5" fill="#0891b2"/>
  <text class="body" x="766" y="382" style="font-weight:700">Leve</text>
  <text class="small" x="766" y="404">Sobe em segundos e gasta pouco, porque não carrega outro sistema.</text>
  <circle cx="750" cy="432" r="5" fill="#0891b2"/>
  <text class="body" x="766" y="437" style="font-weight:700">Quando usar</text>
  <text class="small" x="766" y="459">Aplicação isolada, sem precisar de outro kernel nem de outro sistema.</text>
  <circle cx="750" cy="487" r="5" fill="#0891b2"/>
  <text class="body" x="766" y="492" style="font-weight:700">Cuidado</text>
  <text class="small" x="766" y="514">Kernel compartilhado: uma falha no kernel afeta todos.</text>
  <line x1="60" y1="758" x2="1340" y2="758" stroke="#d8d5cc" stroke-width="1"/>
  <text class="foot" x="60" y="792">A pergunta de decisão é sempre a mesma: preciso de outro kernel, de outro sistema ou de isolamento forte? Se não, o contêiner basta.</text>
</svg>
