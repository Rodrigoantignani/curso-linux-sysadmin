<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="822" viewBox="0 0 1400 822" role="img" aria-labelledby="titulo desc">
  <title id="titulo">O cardápio do GRUB e as duas receitas de resgate</title>
  <desc id="desc">Cada entrada é uma receita: kernel, initramfs e a linha linux que o kernel repassa ao systemd</desc>
  <style>
    .bg { fill: #f6f4ee; }
    .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 40px; font-weight: 700; fill: #14213d; }
    .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 19px; fill: #5b6472; }
    .h2 { font-family: 'Segoe UI', Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #14213d; }
    .card { fill: #ffffff; stroke: #d8d5cc; stroke-width: 1.5; }
    .step-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #14213d; }
    .step-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .small { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #5b6472; }
    .body { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #2b3240; }
    .mono { font-family: 'Cascadia Code', Consolas, monospace; font-size: 14px; fill: #2563eb; }
    .term { font-family: 'Cascadia Code', Consolas, monospace; font-size: 15px; fill: #e2e8f0; }
    .term-title { font-family: 'Cascadia Code', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #ffffff; }
    .num { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
    .foot { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .foot-strong { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #14213d; }
    .arrow { stroke: #8b93a1; stroke-width: 2.5; fill: none; }
    .tag { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b93a1"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="822"/>
  <text class="title" x="60" y="62">O cardápio do GRUB e as duas receitas de resgate</text>
  <text class="subtitle" x="60" y="98">Cada entrada é uma receita: kernel, initramfs e a linha linux que o kernel repassa ao systemd</text>

  <rect class="card" x="60" y="156" width="620" height="556" rx="16"/>
  <rect x="60" y="156" width="620" height="64" rx="16" fill="#dc2626" opacity="0.10"/>
  <rect x="60" y="204" width="620" height="16" fill="#dc2626" opacity="0.10"/>
  <text class="h2" x="84" y="196">O cardápio</text>
  <text class="small" x="84" y="244">mexer na receita de dois jeitos</text>
  <circle cx="90" cy="267" r="5" fill="#dc2626"/>
  <text class="body" x="106" y="272" style="font-weight:700">Cada entrada</text>
  <text class="small" x="106" y="294">Diz qual kernel, qual initramfs e quais parâmetros passar.</text>
  <circle cx="90" cy="322" r="5" fill="#dc2626"/>
  <text class="body" x="106" y="327" style="font-weight:700">Na hora: e, Ctrl+X</text>
  <text class="small" x="106" y="349">A edição vale só para este boot.</text>
  <circle cx="90" cy="377" r="5" fill="#dc2626"/>
  <text class="body" x="106" y="382" style="font-weight:700">De vez na Rocky</text>
  <text class="small" x="106" y="404">grubby altera a entrada e regenera a configuração.</text>
  <circle cx="90" cy="432" r="5" fill="#dc2626"/>
  <text class="body" x="106" y="437" style="font-weight:700">De vez na Debian</text>
  <text class="small" x="106" y="459">/etc/default/grub seguido de update-grub.</text>
  <circle cx="90" cy="487" r="5" fill="#dc2626"/>
  <text class="body" x="106" y="492" style="font-weight:700">Parâmetro útil</text>
  <text class="small" x="106" y="514">systemd.unit=rescue.target sobe direto no modo de manutenção.</text>
  <rect class="card" x="720" y="156" width="620" height="556" rx="16"/>
  <rect x="720" y="156" width="620" height="64" rx="16" fill="#dc2626" opacity="0.10"/>
  <rect x="720" y="204" width="620" height="16" fill="#dc2626" opacity="0.10"/>
  <text class="h2" x="744" y="196">As duas receitas</text>
  <text class="small" x="744" y="244">parar antes do sistema normal é o que dá root sem senha</text>
  <circle cx="750" cy="267" r="5" fill="#dc2626"/>
  <text class="body" x="766" y="272" style="font-weight:700">Rocky: rd.break</text>
  <text class="small" x="766" y="294">Para no fim do initramfs. Depois: remount rw, chroot, passwd, touch</text>
  <text class="small" x="766" y="313">/.autorelabel, reboot.</text>
  <circle cx="750" cy="341" r="5" fill="#dc2626"/>
  <text class="body" x="766" y="346" style="font-weight:700">Debian: init=/bin/bash</text>
  <text class="small" x="766" y="368">Troca o systemd por um bash como PID 1. Depois: remount rw, passwd, reboot.</text>
  <circle cx="750" cy="396" r="5" fill="#dc2626"/>
  <text class="body" x="766" y="401" style="font-weight:700">Por que funciona</text>
  <text class="small" x="766" y="423">Ainda não existe ninguém pedindo senha: o shell já é root.</text>
  <circle cx="750" cy="451" r="5" fill="#dc2626"/>
  <text class="body" x="766" y="456" style="font-weight:700">A defesa</text>
  <text class="small" x="766" y="478">Quem tem o console tem o root. Proteja o GRUB ou cifre o disco.</text>
  <line x1="60" y1="758" x2="1340" y2="758" stroke="#d8d5cc" stroke-width="1"/>
  <text class="foot" x="60" y="792">O parâmetro certo para no ponto certo: rd.break no fim do initramfs; init=/bin/bash troca o systemd por um bash como primeiro processo.</text>
</svg>
