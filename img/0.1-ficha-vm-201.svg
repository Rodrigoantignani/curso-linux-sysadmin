<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="titulo desc">
  <title id="titulo">A ficha da VM 201: cinco peças ligadas a quatro recursos do cluster</title>
  <desc id="desc">A ficha 201.conf, no /etc/pve/qemu-server, descreve CPU, memória, disco, rede, ISO e NVRAM. O qm start lê essa ficha e monta o processo QEMU, que usa a CPU e a memória do nó, o Ceph, a bridge vmbr0 e o storage local da ISO.</desc>
  <style>
    .bg { fill: #f6f4ee; }
    .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 42px; font-weight: 700; fill: #14213d; }
    .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; fill: #5b6472; }
    .card { fill: #ffffff; stroke: #d8d5cc; stroke-width: 1.5; }
    .filebar { fill: #14213d; }
    .filetitle { font-family: 'Cascadia Code', Consolas, monospace; font-size: 22px; font-weight: 700; fill: #ffffff; }
    .mono { font-family: 'Cascadia Code', Consolas, monospace; font-size: 17px; fill: #2b3240; }
    .key { fill: #2563eb; }
    .qemu-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 25px; font-weight: 700; fill: #ffffff; }
    .qemu-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #cbd5e1; }
    .dest-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #14213d; }
    .dest-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .num { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
    .note { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .note-strong { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #14213d; }
    .legend { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #2b3240; }
    .arrow { stroke: #9aa1ad; stroke-width: 2; fill: none; }
    .arrow-blue { stroke: #2563eb; stroke-width: 2.5; fill: none; }
  </style>
  <defs>
    <marker id="ponta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa1ad"/>
    </marker>
    <marker id="ponta-azul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="860"/>

  <text class="title" x="60" y="64">A ficha da VM 201</text>
  <text class="subtitle" x="60" y="98">5 peças da ficha · 4 destinos no cluster: nó, Ceph, vmbr0 e storage local</text>

  <!-- Ficha -->
  <rect class="card" x="60" y="140" width="520" height="610" rx="16"/>
  <path class="filebar" d="M60 156 a16 16 0 0 1 16 -16 h488 a16 16 0 0 1 16 16 v50 h-520 z"/>
  <text class="filetitle" x="88" y="181">/etc/pve/qemu-server/201.conf</text>
  <rect x="60" y="206" width="520" height="4" fill="#2563eb"/>

  <text class="mono" x="88" y="252"><tspan class="key">memory:</tspan> 2048</text>
  <text class="mono" x="88" y="290"><tspan class="key">cores:</tspan> 2</text>
  <text class="mono" x="88" y="328"><tspan class="key">cpu:</tspan> x86-64-v2-AES</text>
  <text class="mono" x="88" y="366"><tspan class="key">machine:</tspan> q35</text>
  <text class="mono" x="88" y="404"><tspan class="key">bios:</tspan> ovmf</text>
  <text class="mono" x="88" y="442"><tspan class="key">scsi0:</tspan> vm-hdd:vm-201-disk-0</text>
  <text class="mono" x="88" y="480"><tspan class="key">efidisk0:</tspan> vm-hdd:vm-201-disk-1</text>
  <text class="mono" x="88" y="518"><tspan class="key">net0:</tspan> virtio,bridge=vmbr0</text>
  <text class="mono" x="88" y="556"><tspan class="key">ide2:</tspan> local:iso/rocky-9.iso</text>
  <text class="mono" x="116" y="584">media=cdrom</text>
  <text class="mono" x="88" y="622"><tspan class="key">boot:</tspan> order=scsi0;ide2</text>

  <line x1="88" y1="648" x2="552" y2="648" stroke="#e5e2d9" stroke-width="1"/>
  <text class="note-strong" x="88" y="676">As 5 peças</text>
  <circle cx="96" cy="700" r="9" fill="#2563eb"/><text class="num" x="96" y="705" text-anchor="middle">1</text>
  <text class="legend" x="114" y="705">CPU + memória</text>
  <circle cx="258" cy="700" r="9" fill="#7c3aed"/><text class="num" x="258" y="705" text-anchor="middle">2</text>
  <text class="legend" x="276" y="705">disco scsi0</text>
  <circle cx="410" cy="700" r="9" fill="#059669"/><text class="num" x="410" y="705" text-anchor="middle">3</text>
  <text class="legend" x="428" y="705">rede net0</text>
  <circle cx="96" cy="730" r="9" fill="#d97706"/><text class="num" x="96" y="735" text-anchor="middle">4</text>
  <text class="legend" x="114" y="735">ISO ide2</text>
  <circle cx="258" cy="730" r="9" fill="#7c3aed"/><text class="num" x="258" y="735" text-anchor="middle">5</text>
  <text class="legend" x="276" y="735">NVRAM efidisk0</text>

  <!-- QEMU -->
  <rect x="720" y="350" width="250" height="150" rx="16" fill="#14213d"/>
  <text class="qemu-title" x="845" y="402" text-anchor="middle">QEMU + KVM</text>
  <text class="qemu-sub" x="845" y="430" text-anchor="middle">lê a ficha e monta a VM</text>
  <text class="qemu-sub" x="845" y="454" text-anchor="middle">qm start 201</text>

  <path class="arrow-blue" d="M580 430 H714" marker-end="url(#ponta-azul)"/>
  <text class="note" x="590" y="416">qm start</text>

  <!-- Destino 1: host -->
  <rect class="card" x="1110" y="150" width="230" height="110" rx="14"/>
  <rect x="1110" y="150" width="8" height="110" rx="4" fill="#2563eb"/>
  <circle cx="1140" cy="180" r="13" fill="#2563eb"/>
  <text class="num" x="1140" y="185" text-anchor="middle">1</text>
  <text class="dest-title" x="1164" y="185">CPU e memória</text>
  <text class="dest-sub" x="1134" y="214">do nó Proxmox</text>
  <text class="dest-sub" x="1134" y="236">2 GB · 2 núcleos</text>

  <!-- Destino 2: Ceph -->
  <rect class="card" x="1110" y="300" width="230" height="110" rx="14"/>
  <rect x="1110" y="300" width="8" height="110" rx="4" fill="#7c3aed"/>
  <circle cx="1140" cy="330" r="13" fill="#7c3aed"/>
  <text class="num" x="1140" y="335" text-anchor="middle">2</text>
  <text class="dest-title" x="1164" y="335">Ceph</text>
  <text class="dest-sub" x="1134" y="364">disco scsi0</text>
  <text class="dest-sub" x="1134" y="386">NVRAM efidisk0</text>

  <!-- Destino 3: vmbr0 -->
  <rect class="card" x="1110" y="450" width="230" height="110" rx="14"/>
  <rect x="1110" y="450" width="8" height="110" rx="4" fill="#059669"/>
  <circle cx="1140" cy="480" r="13" fill="#059669"/>
  <text class="num" x="1140" y="485" text-anchor="middle">3</text>
  <text class="dest-title" x="1164" y="485">vmbr0</text>
  <text class="dest-sub" x="1134" y="514">placa virtio</text>
  <text class="dest-sub" x="1134" y="536">bridge da rede</text>

  <!-- Destino 4: storage local -->
  <rect class="card" x="1110" y="600" width="230" height="110" rx="14"/>
  <rect x="1110" y="600" width="8" height="110" rx="4" fill="#d97706"/>
  <circle cx="1140" cy="630" r="13" fill="#d97706"/>
  <text class="num" x="1140" y="635" text-anchor="middle">4</text>
  <text class="dest-title" x="1164" y="635">Storage local</text>
  <text class="dest-sub" x="1134" y="664">ISO ide2</text>
  <text class="dest-sub" x="1134" y="686">prende a VM ao nó</text>

  <!-- Setas do QEMU para os destinos -->
  <path class="arrow" d="M970 385 C1030 340, 1050 220, 1104 205" marker-end="url(#ponta)"/>
  <path class="arrow" d="M970 410 C1020 390, 1060 360, 1104 355" marker-end="url(#ponta)"/>
  <path class="arrow" d="M970 445 C1020 470, 1060 500, 1104 505" marker-end="url(#ponta)"/>
  <path class="arrow" d="M970 475 C1030 530, 1050 640, 1104 655" marker-end="url(#ponta)"/>

  <!-- Rodapé -->
  <rect x="60" y="790" width="1280" height="46" rx="12" fill="#ffffff" stroke="#d8d5cc"/>
  <text class="note" x="82" y="819">O que está na ficha, o QEMU vê; o que não está, não existe. A ISO local prende a VM ao nó enquanto estiver no CD-ROM: ejete antes de migrar.</text>
</svg>
