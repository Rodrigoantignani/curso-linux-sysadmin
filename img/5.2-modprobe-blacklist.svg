<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="744" viewBox="0 0 1400 744" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Módulos do kernel: encaixar e tirar</title>
  <desc id="desc">modprobe respeita dependências; insmod não. blacklist só impede a carga automática</desc>
  <style>
    .bg { fill: #f6f4ee; }
    .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 40px; font-weight: 700; fill: #14213d; }
    .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 19px; fill: #5b6472; }
    .h2 { font-family: 'Segoe UI', Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #14213d; }
    .card { fill: #ffffff; stroke: #d8d5cc; stroke-width: 1.5; }
    .step-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #14213d; }
    .step-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .small { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #5b6472; }
    .body { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #2b3240; }
    .mono { font-family: 'Cascadia Code', Consolas, monospace; font-size: 14px; fill: #2563eb; }
    .term { font-family: 'Cascadia Code', Consolas, monospace; font-size: 15px; fill: #e2e8f0; }
    .term-title { font-family: 'Cascadia Code', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #ffffff; }
    .num { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
    .foot { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .foot-strong { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #14213d; }
    .arrow { stroke: #8b93a1; stroke-width: 2.5; fill: none; }
    .tag { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b93a1"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="744"/>
  <text class="title" x="60" y="62">Módulos do kernel: encaixar e tirar</text>
  <text class="subtitle" x="60" y="98">modprobe respeita dependências; insmod não. blacklist só impede a carga automática</text>

  <rect class="card" x="60" y="156" width="780" height="86" rx="12"/>
  <rect x="60" y="156" width="10" height="86" rx="5" fill="#d97706"/>
  <text class="step-title" x="90" y="188" style="font-size:19px">lsmod</text>
  <text class="small" x="90" y="211">o que está encaixado agora.</text>
  <line class="arrow" x1="450" y1="242" x2="450" y2="254" marker-end="url(#seta)"/>
  <rect class="card" x="60" y="254" width="780" height="86" rx="12"/>
  <rect x="60" y="254" width="10" height="86" rx="5" fill="#d97706"/>
  <text class="step-title" x="90" y="286" style="font-size:19px">modprobe nome</text>
  <text class="small" x="90" y="309">encaixa o módulo e suas dependências.</text>
  <line class="arrow" x1="450" y1="340" x2="450" y2="352" marker-end="url(#seta)"/>
  <rect class="card" x="60" y="352" width="780" height="86" rx="12"/>
  <rect x="60" y="352" width="10" height="86" rx="5" fill="#d97706"/>
  <text class="step-title" x="90" y="384" style="font-size:19px">modprobe -r nome</text>
  <text class="small" x="90" y="407">tira o módulo (se ninguém precisar dele).</text>
  <line class="arrow" x1="450" y1="438" x2="450" y2="450" marker-end="url(#seta)"/>
  <rect class="card" x="60" y="450" width="780" height="86" rx="12"/>
  <rect x="60" y="450" width="10" height="86" rx="5" fill="#d97706"/>
  <text class="step-title" x="90" y="482" style="font-size:19px">blacklist nome</text>
  <text class="small" x="90" y="505">impede a carga automática no boot.</text>
  <line class="arrow" x1="450" y1="536" x2="450" y2="548" marker-end="url(#seta)"/>
  <rect class="card" x="60" y="548" width="780" height="86" rx="12"/>
  <rect x="60" y="548" width="10" height="86" rx="5" fill="#d97706"/>
  <text class="step-title" x="90" y="580" style="font-size:19px">install nome /bin/false</text>
  <text class="small" x="90" y="603">bloqueia também o carregamento manual.</text>
  <rect class="card" x="880" y="156" width="460" height="270" rx="16"/>
  <rect x="880" y="156" width="8" height="270" rx="4" fill="#d97706"/>
  <text class="h2" x="908" y="194">Onde fica</text>
  <circle cx="914" cy="225" r="6" fill="#d97706"/>
  <text class="body" x="932" y="230" style="font-weight:700">/lib/modules/$(uname -r)/</text>
  <text class="small" x="932" y="254">os arquivos .ko de cada lâmina</text>
  <circle cx="914" cy="285" r="6" fill="#d97706"/>
  <text class="body" x="932" y="290" style="font-weight:700">/etc/modprobe.d/</text>
  <text class="small" x="932" y="314">suas regras de blacklist e install</text>
  <circle cx="914" cy="345" r="6" fill="#d97706"/>
  <text class="body" x="932" y="350" style="font-weight:700">/etc/sysctl.d/</text>
  <text class="small" x="932" y="374">as regulagens do kernel para o próximo boot</text>
  <line x1="60" y1="680" x2="1340" y2="680" stroke="#d8d5cc" stroke-width="1"/>
  <text class="foot" x="60" y="714">Prefira blacklist a install /bin/false: o primeiro deixa o módulo disponível para carregar à mão; o segundo bloqueia também o carregamento manual.</text>
</svg>
