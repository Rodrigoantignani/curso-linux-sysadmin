<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="596" viewBox="0 0 1400 596" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Uma linha de produção de filtros</title>
  <desc id="desc">Cada filtro lê linhas, faz uma coisa só e entrega o resultado ao próximo</desc>
  <style>
    .bg { fill: #f6f4ee; }
    .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 40px; font-weight: 700; fill: #14213d; }
    .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 19px; fill: #5b6472; }
    .h2 { font-family: 'Segoe UI', Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #14213d; }
    .card { fill: #ffffff; stroke: #d8d5cc; stroke-width: 1.5; }
    .step-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #14213d; }
    .step-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .small { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #5b6472; }
    .body { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #2b3240; }
    .mono { font-family: 'Cascadia Code', Consolas, monospace; font-size: 14px; fill: #2563eb; }
    .term { font-family: 'Cascadia Code', Consolas, monospace; font-size: 15px; fill: #e2e8f0; }
    .term-title { font-family: 'Cascadia Code', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #ffffff; }
    .num { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
    .foot { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .foot-strong { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #14213d; }
    .arrow { stroke: #8b93a1; stroke-width: 2.5; fill: none; }
    .tag { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b93a1"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="596"/>
  <text class="title" x="60" y="62">Uma linha de produção de filtros</text>
  <text class="subtitle" x="60" y="98">Cada filtro lê linhas, faz uma coisa só e entrega o resultado ao próximo</text>

  <rect class="card" x="60" y="176" width="192" height="300" rx="14"/>
  <rect x="60" y="176" width="192" height="10" rx="5" fill="#0891b2"/>
  <circle cx="90" cy="222" r="17" fill="#0891b2"/>
  <text class="num" x="90" y="227" text-anchor="middle">1</text>
  <text class="step-title" x="116" y="222" style="font-size:18px">acesso.log</text>
  <text class="small" x="76" y="272">O arquivo bruto: 15</text>
  <text class="small" x="76" y="291">linhas de log.</text>
  <rect x="76" y="434" width="160" height="26" rx="13" fill="#0891b2" opacity="0.12"/>
  <text class="small" x="88" y="452" style="font-weight:700;fill:#0891b2">entrada</text>
  <line class="arrow" x1="254" y1="326.0" x2="274" y2="326.0" marker-end="url(#seta)"/>
  <rect class="card" x="278" y="176" width="192" height="300" rx="14"/>
  <rect x="278" y="176" width="192" height="10" rx="5" fill="#0891b2"/>
  <circle cx="308" cy="222" r="17" fill="#0891b2"/>
  <text class="num" x="308" y="227" text-anchor="middle">2</text>
  <text class="step-title" x="334" y="222" style="font-size:18px">cut -d&#x27; &#x27; -f1</text>
  <text class="small" x="294" y="272">Separa pelo espaço e</text>
  <text class="small" x="294" y="291">guarda só o primeiro</text>
  <text class="small" x="294" y="310">campo: o IP.</text>
  <rect x="294" y="434" width="160" height="26" rx="13" fill="#0891b2" opacity="0.12"/>
  <text class="small" x="306" y="452" style="font-weight:700;fill:#0891b2">só o IP</text>
  <line class="arrow" x1="471" y1="326.0" x2="491" y2="326.0" marker-end="url(#seta)"/>
  <rect class="card" x="495" y="176" width="192" height="300" rx="14"/>
  <rect x="495" y="176" width="192" height="10" rx="5" fill="#0891b2"/>
  <circle cx="525" cy="222" r="17" fill="#0891b2"/>
  <text class="num" x="525" y="227" text-anchor="middle">3</text>
  <text class="step-title" x="551" y="222" style="font-size:18px">sort</text>
  <text class="small" x="511" y="272">Junta os iguais em</text>
  <text class="small" x="511" y="291">blocos, para o uniq</text>
  <text class="small" x="511" y="310">contar de verdade.</text>
  <rect x="511" y="434" width="160" height="26" rx="13" fill="#0891b2" opacity="0.12"/>
  <text class="small" x="523" y="452" style="font-weight:700;fill:#0891b2">iguais juntos</text>
  <line class="arrow" x1="689" y1="326.0" x2="709" y2="326.0" marker-end="url(#seta)"/>
  <rect class="card" x="713" y="176" width="192" height="300" rx="14"/>
  <rect x="713" y="176" width="192" height="10" rx="5" fill="#0891b2"/>
  <circle cx="743" cy="222" r="17" fill="#0891b2"/>
  <text class="num" x="743" y="227" text-anchor="middle">4</text>
  <text class="step-title" x="769" y="222" style="font-size:18px">uniq -c</text>
  <text class="small" x="729" y="272">Conta cada bloco de</text>
  <text class="small" x="729" y="291">linhas iguais.</text>
  <rect x="729" y="434" width="160" height="26" rx="13" fill="#0891b2" opacity="0.12"/>
  <text class="small" x="741" y="452" style="font-weight:700;fill:#0891b2">conta vizinhos</text>
  <line class="arrow" x1="907" y1="326.0" x2="927" y2="326.0" marker-end="url(#seta)"/>
  <rect class="card" x="931" y="176" width="192" height="300" rx="14"/>
  <rect x="931" y="176" width="192" height="10" rx="5" fill="#0891b2"/>
  <circle cx="961" cy="222" r="17" fill="#0891b2"/>
  <text class="num" x="961" y="227" text-anchor="middle">5</text>
  <text class="step-title" x="987" y="222" style="font-size:18px">sort -rn</text>
  <text class="small" x="947" y="272">Ordena pelo número, do</text>
  <text class="small" x="947" y="291">maior para o menor.</text>
  <rect x="947" y="434" width="160" height="26" rx="13" fill="#0891b2" opacity="0.12"/>
  <text class="small" x="959" y="452" style="font-weight:700;fill:#0891b2">maior primeiro</text>
  <line class="arrow" x1="1124" y1="326.0" x2="1144" y2="326.0" marker-end="url(#seta)"/>
  <rect class="card" x="1148" y="176" width="192" height="300" rx="14"/>
  <rect x="1148" y="176" width="192" height="10" rx="5" fill="#0891b2"/>
  <circle cx="1178" cy="222" r="17" fill="#0891b2"/>
  <text class="num" x="1178" y="227" text-anchor="middle">6</text>
  <text class="step-title" x="1204" y="222" style="font-size:18px">head -3</text>
  <text class="small" x="1164" y="272">Corta os três primeiros.</text>
  <rect x="1164" y="434" width="160" height="26" rx="13" fill="#0891b2" opacity="0.12"/>
  <text class="small" x="1176" y="452" style="font-weight:700;fill:#0891b2">os 3 IPs</text>
  <line x1="60" y1="532" x2="1340" y2="532" stroke="#d8d5cc" stroke-width="1"/>
  <text class="foot" x="60" y="566">Sem sort antes do uniq, o mesmo valor aparece em blocos separados e a contagem sai errada. Nenhum filtro altera o arquivo original.</text>
</svg>
