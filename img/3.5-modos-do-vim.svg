<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Os modos do vim</title>
  <desc id="desc">No modo normal cada tecla é um comando; para escrever, entre no modo de inserção e saia com Esc</desc>
  <style>
    .bg { fill: #f6f4ee; }
    .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 40px; font-weight: 700; fill: #14213d; }
    .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 19px; fill: #5b6472; }
    .h2 { font-family: 'Segoe UI', Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #14213d; }
    .card { fill: #ffffff; stroke: #d8d5cc; stroke-width: 1.5; }
    .step-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #14213d; }
    .step-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .small { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #5b6472; }
    .body { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #2b3240; }
    .mono { font-family: 'Cascadia Code', Consolas, monospace; font-size: 14px; fill: #2563eb; }
    .term { font-family: 'Cascadia Code', Consolas, monospace; font-size: 15px; fill: #e2e8f0; }
    .term-title { font-family: 'Cascadia Code', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #ffffff; }
    .num { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
    .foot { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .foot-strong { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #14213d; }
    .arrow { stroke: #8b93a1; stroke-width: 2.5; fill: none; }
    .tag { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b93a1"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="860"/>
  <text class="title" x="60" y="62">Os modos do vim</text>
  <text class="subtitle" x="60" y="98">No modo normal cada tecla é um comando; para escrever, entre no modo de inserção e saia com Esc</text>

  <rect x="520" y="200" width="360" height="150" rx="18" fill="#059669"/>
  <text x="700" y="252" text-anchor="middle" style="font-family:'Segoe UI', Arial, sans-serif;font-size:30px;font-weight:700;fill:#fff">NORMAL</text>
  <text x="700" y="286" text-anchor="middle" style="font-family:'Segoe UI', Arial, sans-serif;font-size:15px;fill:#dbeafe">cada tecla é um comando</text>
  <text x="700" y="312" text-anchor="middle" style="font-family:'Cascadia Code', Consolas, monospace;font-size:14px;fill:#bfdbfe">x  d  y  p  u  /</text>
  <rect x="1010" y="190" width="330" height="150" rx="18" fill="#059669"/>
  <text x="1175" y="242" text-anchor="middle" style="font-family:'Segoe UI', Arial, sans-serif;font-size:28px;font-weight:700;fill:#fff">INSERÇÃO</text>
  <text x="1175" y="276" text-anchor="middle" style="font-family:'Segoe UI', Arial, sans-serif;font-size:15px;fill:#d1fae5">as teclas viram texto</text>
  <text x="1175" y="302" text-anchor="middle" style="font-family:'Cascadia Code', Consolas, monospace;font-size:14px;fill:#a7f3d0">-- INSERT --</text>
  <line class="arrow" x1="884" y1="250" x2="1002" y2="240" marker-end="url(#seta)"/>
  <text class="small" x="898" y="232">i  a  o  I  A  O</text>
  <line class="arrow" x1="1002" y1="300" x2="884" y2="300" marker-end="url(#seta)"/>
  <text class="small" x="918" y="320">Esc</text>
  <rect x="520" y="540" width="360" height="150" rx="18" fill="#d97706"/>
  <text x="700" y="592" text-anchor="middle" style="font-family:'Segoe UI', Arial, sans-serif;font-size:28px;font-weight:700;fill:#fff">LINHA DE COMANDO</text>
  <text x="700" y="626" text-anchor="middle" style="font-family:'Segoe UI', Arial, sans-serif;font-size:15px;fill:#fef3c7">roda quando você aperta Enter</text>
  <text x="700" y="652" text-anchor="middle" style="font-family:'Cascadia Code', Consolas, monospace;font-size:14px;fill:#fde68a">:wq  :%s/a/b/g  /regex</text>
  <line class="arrow" x1="700" y1="350" x2="700" y2="532" marker-end="url(#seta)"/>
  <text class="small" x="714" y="390">:  /  ?</text>
  <line class="arrow" x1="720" y1="532" x2="720" y2="358" marker-end="url(#seta)"/>
  <text class="small" x="734" y="520">Enter ou Esc</text>
  <rect x="70" y="190" width="330" height="150" rx="18" fill="#7c3aed"/>
  <text x="235" y="242" text-anchor="middle" style="font-family:'Segoe UI', Arial, sans-serif;font-size:28px;font-weight:700;fill:#fff">VISUAL</text>
  <text x="235" y="276" text-anchor="middle" style="font-family:'Segoe UI', Arial, sans-serif;font-size:15px;fill:#ede9fe">seleciona texto ou linhas</text>
  <text x="235" y="302" text-anchor="middle" style="font-family:'Cascadia Code', Consolas, monospace;font-size:14px;fill:#ddd6fe">v  V  Ctrl-v</text>
  <line class="arrow" x1="516" y1="250" x2="404" y2="240" marker-end="url(#seta)"/>
  <text class="small" x="424" y="232">v  V  Ctrl-v</text>
  <line class="arrow" x1="404" y1="300" x2="516" y2="300" marker-end="url(#seta)"/>
  <text class="small" x="430" y="320">Esc</text>
  <rect class="card" x="70" y="730" width="1270" height="66" rx="12"/>
  <text class="body" x="94" y="760" style="font-weight:700">A gramática do modo normal:</text>
  <text class="mono" x="432" y="760" style="font-size:16px">[contagem] operador [contagem] movimento</text>
  <text class="small" x="94" y="783">dw apaga até a próxima palavra · c$ troca até o fim da linha · 3dd apaga três linhas · yy copia a linha · p cola</text>
  <line x1="60" y1="796" x2="1340" y2="796" stroke="#d8d5cc" stroke-width="1"/>
  <text class="foot" x="60" y="830">Na dúvida, aperte Esc duas vezes: você volta ao modo normal, de onde tudo começa. A gramática é [contagem] operador [contagem] movimento.</text>
</svg>
