<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="914" viewBox="0 0 1400 914" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Quattro errori di rete e su quale gradino sta ognuno</title>
  <desc id="desc">Il messaggio d'errore dice già dove guardare</desc>
  <style>
    .bg { fill: #f6f4ee; }
    .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 40px; font-weight: 700; fill: #14213d; }
    .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 19px; fill: #5b6472; }
    .h2 { font-family: 'Segoe UI', Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #14213d; }
    .card { fill: #ffffff; stroke: #d8d5cc; stroke-width: 1.5; }
    .step-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #14213d; }
    .step-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .small { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #5b6472; }
    .body { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #2b3240; }
    .mono { font-family: 'Cascadia Code', Consolas, monospace; font-size: 14px; fill: #2563eb; }
    .term { font-family: 'Cascadia Code', Consolas, monospace; font-size: 15px; fill: #e2e8f0; }
    .term-title { font-family: 'Cascadia Code', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #ffffff; }
    .num { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
    .foot { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .foot-strong { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #14213d; }
    .arrow { stroke: #8b93a1; stroke-width: 2.5; fill: none; }
    .tag { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b93a1"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="914"/>
  <text class="title" x="60" y="62">Quattro errori di rete e su quale gradino sta ognuno</text>
  <text class="subtitle" x="60" y="98">Il messaggio d'errore dice già dove guardare</text>

  <rect class="card" x="60" y="156" width="620" height="648" rx="16"/>
  <rect x="60" y="156" width="620" height="64" rx="16" fill="#0891b2" opacity="0.10"/>
  <rect x="60" y="204" width="620" height="16" fill="#0891b2" opacity="0.10"/>
  <text class="h2" x="84" y="196">Messaggio → gradino</text>
  <text class="small" x="84" y="244">cosa indica ogni errore</text>
  <circle cx="90" cy="267" r="5" fill="#0891b2"/>
  <text class="body" x="106" y="272" style="font-weight:700">No route to host</text>
  <text class="small" x="106" y="294">gradino 2 (rotta): nessuna strada fino al gateway</text>
  <circle cx="90" cy="322" r="5" fill="#0891b2"/>
  <text class="body" x="106" y="327" style="font-weight:700">Connection refused</text>
  <text class="small" x="106" y="349">gradino 4 (porta): nessuno ascolta su quella porta</text>
  <circle cx="90" cy="377" r="5" fill="#0891b2"/>
  <text class="body" x="106" y="382" style="font-weight:700">Name or service not known</text>
  <text class="small" x="106" y="404">gradino 3 (nome): il nome non diventa IP</text>
  <circle cx="90" cy="432" r="5" fill="#0891b2"/>
  <text class="body" x="106" y="437" style="font-weight:700">il comando resta fermo</text>
  <text class="small" x="106" y="459">gradino 5 (applicazione): il servizio non risponde</text>
  <rect class="card" x="720" y="156" width="620" height="648" rx="16"/>
  <rect x="720" y="156" width="620" height="64" rx="16" fill="#0891b2" opacity="0.10"/>
  <rect x="720" y="204" width="620" height="16" fill="#0891b2" opacity="0.10"/>
  <text class="h2" x="744" y="196">Cosa testare su ogni gradino</text>
  <text class="small" x="744" y="244">dalla scheda in su</text>
  <circle cx="750" cy="267" r="5" fill="#0891b2"/>
  <text class="body" x="766" y="272" style="font-weight:700">0 · Scheda</text>
  <text class="small" x="766" y="294">ip -br link → UP o NO-CARRIER</text>
  <circle cx="750" cy="322" r="5" fill="#0891b2"/>
  <text class="body" x="766" y="327" style="font-weight:700">1 · Indirizzo</text>
  <text class="small" x="766" y="349">ip -br addr → ho un IP nella rete giusta?</text>
  <circle cx="750" cy="377" r="5" fill="#0891b2"/>
  <text class="body" x="766" y="382" style="font-weight:700">2 · Rotta</text>
  <text class="small" x="766" y="404">ip route; ping al gateway</text>
  <circle cx="750" cy="432" r="5" fill="#0891b2"/>
  <text class="body" x="766" y="437" style="font-weight:700">3 · Nome</text>
  <text class="small" x="766" y="459">getent hosts nome</text>
  <circle cx="750" cy="487" r="5" fill="#0891b2"/>
  <text class="body" x="766" y="492" style="font-weight:700">4 · Porta</text>
  <text class="small" x="766" y="514">ss -tlnp; nc o /dev/tcp da fuori</text>
  <circle cx="750" cy="542" r="5" fill="#0891b2"/>
  <text class="body" x="766" y="547" style="font-weight:700">5 · Applicazione</text>
  <text class="small" x="766" y="569">curl -v</text>
  <line x1="60" y1="850" x2="1340" y2="850" stroke="#d8d5cc" stroke-width="1"/>
  <text class="foot" x="60" y="884">Sali un gradino alla volta. Se il server non ha IP, è inutile testare il DNS. Se il nome non si risolve, è inutile guardare il firewall del sito.</text>
</svg>
