<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="822" viewBox="0 0 1400 822" role="img" aria-labelledby="titulo desc">
  <title id="titulo">O repositório é uma loja com catálogo</title>
  <desc id="desc">O cliente baixa o catálogo, confere o selo e só então pega o pacote</desc>
  <style>
    .bg { fill: #f6f4ee; }
    .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 40px; font-weight: 700; fill: #14213d; }
    .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 19px; fill: #5b6472; }
    .h2 { font-family: 'Segoe UI', Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #14213d; }
    .card { fill: #ffffff; stroke: #d8d5cc; stroke-width: 1.5; }
    .step-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #14213d; }
    .step-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .small { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #5b6472; }
    .body { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #2b3240; }
    .mono { font-family: 'Cascadia Code', Consolas, monospace; font-size: 14px; fill: #2563eb; }
    .term { font-family: 'Cascadia Code', Consolas, monospace; font-size: 15px; fill: #e2e8f0; }
    .term-title { font-family: 'Cascadia Code', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #ffffff; }
    .num { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
    .foot { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .foot-strong { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #14213d; }
    .arrow { stroke: #8b93a1; stroke-width: 2.5; fill: none; }
    .tag { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b93a1"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="822"/>
  <text class="title" x="60" y="62">O repositório é uma loja com catálogo</text>
  <text class="subtitle" x="60" y="98">O cliente baixa o catálogo, confere o selo e só então pega o pacote</text>

  <rect class="card" x="60" y="156" width="620" height="556" rx="16"/>
  <rect x="60" y="156" width="620" height="64" rx="16" fill="#059669" opacity="0.10"/>
  <rect x="60" y="204" width="620" height="16" fill="#059669" opacity="0.10"/>
  <text class="h2" x="84" y="196">Rocky · dnf</text>
  <text class="small" x="84" y="244">cada pacote carrega a própria assinatura</text>
  <circle cx="90" cy="267" r="5" fill="#059669"/>
  <text class="body" x="106" y="272" style="font-weight:700">O endereço</text>
  <text class="small" x="106" y="294">baseurl, mirrorlist ou metalink no arquivo .repo.</text>
  <circle cx="90" cy="322" r="5" fill="#059669"/>
  <text class="body" x="106" y="327" style="font-weight:700">O catálogo</text>
  <text class="small" x="106" y="349">repodata/repomd.xml e os arquivos que ele aponta.</text>
  <circle cx="90" cy="377" r="5" fill="#059669"/>
  <text class="body" x="106" y="382" style="font-weight:700">O selo</text>
  <text class="small" x="106" y="404">gpgcheck=1 e a chave em /etc/pki/rpm-gpg/.</text>
  <circle cx="90" cy="432" r="5" fill="#059669"/>
  <text class="body" x="106" y="437" style="font-weight:700">A assinatura</text>
  <text class="small" x="106" y="459">Está no próprio .rpm: o dnf confere antes de instalar.</text>
  <circle cx="90" cy="487" r="5" fill="#059669"/>
  <text class="body" x="106" y="492" style="font-weight:700">EPEL e CRB</text>
  <text class="small" x="106" y="514">Repositórios extras com regras próprias de habilitação.</text>
  <rect class="card" x="720" y="156" width="620" height="556" rx="16"/>
  <rect x="720" y="156" width="620" height="64" rx="16" fill="#059669" opacity="0.10"/>
  <rect x="720" y="204" width="620" height="16" fill="#059669" opacity="0.10"/>
  <text class="h2" x="744" y="196">Debian · apt</text>
  <text class="small" x="744" y="244">o índice é assinado; os .deb são conferidos pelo hash</text>
  <circle cx="750" cy="267" r="5" fill="#059669"/>
  <text class="body" x="766" y="272" style="font-weight:700">O endereço</text>
  <text class="small" x="766" y="294">URIs, Suites e Components no sources.list ou no .sources.</text>
  <circle cx="750" cy="322" r="5" fill="#059669"/>
  <text class="body" x="766" y="327" style="font-weight:700">O catálogo</text>
  <text class="small" x="766" y="349">dists/&lt;suite&gt;/InRelease, assinado, e Packages com os hashes.</text>
  <circle cx="750" cy="377" r="5" fill="#059669"/>
  <text class="body" x="766" y="382" style="font-weight:700">O selo</text>
  <text class="small" x="766" y="404">Signed-By: aponta a chave em /usr/share/keyrings ou /etc/apt/keyrings.</text>
  <circle cx="750" cy="432" r="5" fill="#059669"/>
  <text class="body" x="766" y="437" style="font-weight:700">A assinatura</text>
  <text class="small" x="766" y="459">O .deb solto não carrega assinatura: vale o hash do índice.</text>
  <circle cx="750" cy="487" r="5" fill="#059669"/>
  <text class="body" x="766" y="492" style="font-weight:700">Repositório local</text>
  <text class="small" x="766" y="514">A ISO montada vira uma loja com file:// e o mesmo contrato.</text>
  <line x1="60" y1="758" x2="1340" y2="758" stroke="#d8d5cc" stroke-width="1"/>
  <text class="foot" x="60" y="792">No RPM, cada pacote é assinado; no Debian, o índice é assinado e os pacotes são conferidos pelo hash. Sem selo conhecido, o cliente não compra.</text>
</svg>
