<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="676" viewBox="0 0 1400 676" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Os três canais e a ordem do redirecionamento</title>
  <desc id="desc">O shell troca o destino antes de o comando começar, da esquerda para a direita</desc>
  <style>
    .bg { fill: #f6f4ee; }
    .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 40px; font-weight: 700; fill: #14213d; }
    .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 19px; fill: #5b6472; }
    .h2 { font-family: 'Segoe UI', Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #14213d; }
    .card { fill: #ffffff; stroke: #d8d5cc; stroke-width: 1.5; }
    .step-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #14213d; }
    .step-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .small { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #5b6472; }
    .body { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #2b3240; }
    .mono { font-family: 'Cascadia Code', Consolas, monospace; font-size: 14px; fill: #2563eb; }
    .term { font-family: 'Cascadia Code', Consolas, monospace; font-size: 15px; fill: #e2e8f0; }
    .term-title { font-family: 'Cascadia Code', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #ffffff; }
    .num { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
    .foot { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .foot-strong { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #14213d; }
    .arrow { stroke: #8b93a1; stroke-width: 2.5; fill: none; }
    .tag { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b93a1"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="676"/>
  <text class="title" x="60" y="62">Os três canais e a ordem do redirecionamento</text>
  <text class="subtitle" x="60" y="98">O shell troca o destino antes de o comando começar, da esquerda para a direita</text>

  <rect class="card" x="60" y="156" width="700" height="290" rx="14"/>
  <path d="M60 170 a14 14 0 0 1 14 -14 h672 a14 14 0 0 1 14 14 v46 h-700 z" fill="#14213d"/>
  <text class="term-title" x="86" y="192">ordem importa</text>
  <rect x="60" y="216" width="700" height="4" fill="#d97706"/>
  <text class="term" x="88" y="248" style="fill:#7dd3fc">$ cmd &gt; f 2&gt;&amp;1</text>
  <text class="term" x="88" y="275">  1 -&gt; f          depois 2 -&gt; f          tudo no arquivo</text>
  <text class="term" x="88" y="302" style="fill:#7dd3fc">$ cmd 2&gt;&amp;1 &gt; f</text>
  <text class="term" x="88" y="329">  2 -&gt; tela       depois 1 -&gt; f          erros na tela</text>
  <text class="term" x="88" y="356" style="fill:#7dd3fc">$ sudo echo oi &gt; /etc/teste.conf</text>
  <text class="term" x="88" y="383">  o shell abre o arquivo ANTES do sudo: Permission denied</text>
  <text class="term" x="88" y="410" style="fill:#7dd3fc">$ echo oi | sudo tee /etc/teste.conf &gt; /dev/null</text>
  <text class="term" x="88" y="437">  o tee, como root, abre o arquivo; o shell só abre /dev/null</text>
  <rect class="card" x="800" y="156" width="540" height="410" rx="16"/>
  <rect x="800" y="156" width="8" height="410" rx="4" fill="#d97706"/>
  <text class="h2" x="828" y="194">O essencial</text>
  <circle cx="834" cy="225" r="6" fill="#d97706"/>
  <text class="body" x="852" y="230" style="font-weight:700">Três canais</text>
  <text class="small" x="852" y="254">0 é stdin, 1 é stdout e 2 é stderr. Todo processo nasce com os</text>
  <text class="small" x="852" y="274">três.</text>
  <circle cx="834" cy="305" r="6" fill="#d97706"/>
  <text class="body" x="852" y="310" style="font-weight:700">O comando não vê o &gt;</text>
  <text class="small" x="852" y="334">Ele só escreve no 1 e no 2, sem saber se é tela, arquivo ou pipe.</text>
  <circle cx="834" cy="365" r="6" fill="#d97706"/>
  <text class="body" x="852" y="370" style="font-weight:700">2&gt;&amp;1 copia</text>
  <text class="small" x="852" y="394">Ele copia para onde o 1 aponta agora, não para o arquivo por nome.</text>
  <circle cx="834" cy="425" r="6" fill="#d97706"/>
  <text class="body" x="852" y="430" style="font-weight:700">tee e xargs</text>
  <text class="small" x="852" y="454">tee mostra e grava; xargs transforma linhas em argumentos.</text>
  <line x1="60" y1="612" x2="1340" y2="612" stroke="#d8d5cc" stroke-width="1"/>
  <text class="foot" x="60" y="646">Leia da esquerda para a direita: trocar a ordem de 2&gt;&amp;1 muda o resultado. Antes de um rm, use echo para ver o que o shell montou.</text>
</svg>
