<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="822" viewBox="0 0 1400 822" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Como ler um arquivo sem travar o terminal</title>
  <desc id="desc">Medir o tamanho, escolher a lupa certa e nunca usar cat em log gigante</desc>
  <style>
    .bg { fill: #f6f4ee; }
    .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 40px; font-weight: 700; fill: #14213d; }
    .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 19px; fill: #5b6472; }
    .h2 { font-family: 'Segoe UI', Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #14213d; }
    .card { fill: #ffffff; stroke: #d8d5cc; stroke-width: 1.5; }
    .step-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #14213d; }
    .step-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .small { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #5b6472; }
    .body { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #2b3240; }
    .mono { font-family: 'Cascadia Code', Consolas, monospace; font-size: 14px; fill: #2563eb; }
    .term { font-family: 'Cascadia Code', Consolas, monospace; font-size: 15px; fill: #e2e8f0; }
    .term-title { font-family: 'Cascadia Code', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #ffffff; }
    .num { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
    .foot { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .foot-strong { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #14213d; }
    .arrow { stroke: #8b93a1; stroke-width: 2.5; fill: none; }
    .tag { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b93a1"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="822"/>
  <text class="title" x="60" y="62">Como ler um arquivo sem travar o terminal</text>
  <text class="subtitle" x="60" y="98">Medir o tamanho, escolher a lupa certa e nunca usar cat em log gigante</text>

  <rect class="card" x="60" y="156" width="620" height="556" rx="16"/>
  <rect x="60" y="156" width="620" height="64" rx="16" fill="#2563eb" opacity="0.10"/>
  <rect x="60" y="204" width="620" height="16" fill="#2563eb" opacity="0.10"/>
  <text class="h2" x="84" y="196">O arquivo dita a ferramenta</text>
  <text class="small" x="84" y="244">tamanho do arquivo → comando certo</text>
  <circle cx="90" cy="267" r="5" fill="#2563eb"/>
  <text class="body" x="106" y="272" style="font-weight:700">Até 20 linhas</text>
  <text class="small" x="106" y="294">cat ou cat n — cabe na tela</text>
  <circle cx="90" cy="322" r="5" fill="#2563eb"/>
  <text class="body" x="106" y="327" style="font-weight:700">Dezenas a centenas</text>
  <text class="small" x="106" y="349">head n 20 / tail n 20 — só o começo ou o fim</text>
  <circle cx="90" cy="377" r="5" fill="#2563eb"/>
  <text class="body" x="106" y="382" style="font-weight:700">Qualquer coisa maior</text>
  <text class="small" x="106" y="404">less — lê só o que está na tela</text>
  <circle cx="90" cy="432" r="5" fill="#2563eb"/>
  <text class="body" x="106" y="437" style="font-weight:700">Acompanhar ao vivo</text>
  <text class="small" x="106" y="459">tail -f — fica olhando o fim</text>
  <circle cx="90" cy="487" r="5" fill="#2563eb"/>
  <text class="body" x="106" y="492" style="font-weight:700">Log rotacionado</text>
  <text class="small" x="106" y="514">tail -F — reabre se o arquivo for trocado</text>
  <rect class="card" x="720" y="156" width="620" height="556" rx="16"/>
  <rect x="720" y="156" width="620" height="64" rx="16" fill="#2563eb" opacity="0.10"/>
  <rect x="720" y="204" width="620" height="16" fill="#2563eb" opacity="0.10"/>
  <text class="h2" x="744" y="196">O que o grep deixa passar</text>
  <text class="small" x="744" y="244">a linha exista, mas o padrão não casa</text>
  <circle cx="750" cy="267" r="5" fill="#2563eb"/>
  <text class="body" x="766" y="272" style="font-weight:700">maiúsculas × minúsculas</text>
  <text class="small" x="766" y="294">ERROR ≠ error; use -i para ignorar caixa</text>
  <circle cx="750" cy="322" r="5" fill="#2563eb"/>
  <text class="body" x="766" y="327" style="font-weight:700">não está no fim</text>
  <text class="small" x="766" y="349">$ é antes do \n, não do caractere; cat -A mostra o invisível</text>
  <circle cx="750" cy="377" r="5" fill="#2563eb"/>
  <text class="body" x="766" y="382" style="font-weight:700">veio do Windows</text>
  <text class="small" x="766" y="404">\r no fim de cada linha; cat -A mostra ^M</text>
  <circle cx="750" cy="432" r="5" fill="#2563eb"/>
  <text class="body" x="766" y="437" style="font-weight:700">não existe de verdade</text>
  <text class="small" x="766" y="459">o padrão pode casar com nada; teste com -c e com -v</text>
  <line x1="60" y1="758" x2="1340" y2="758" stroke="#d8d5cc" stroke-width="1"/>
  <text class="foot" x="60" y="792">Cat desenrola tudo; less é a lupa; grep é a peneira. Meça antes de abrir: ls -lh diz se cabe num cat.</text>
</svg>
