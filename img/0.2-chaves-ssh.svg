<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Chaves do SSH: quem confere quem</title>
  <desc id="desc">Diagrama de sequência entre o Windows e a VM. O servidor apresenta a chave de host e o known_hosts confere; depois o servidor manda um desafio, o cliente assina com a chave privada e o sshd confere com a chave pública guardada no authorized_keys.</desc>
  <style>
    .bg { fill: #f6f4ee; }
    .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 42px; font-weight: 700; fill: #14213d; }
    .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; fill: #5b6472; }
    .card { fill: #ffffff; stroke: #d8d5cc; stroke-width: 1.5; }
    .host-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #14213d; }
    .host-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .mini-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #14213d; }
    .mono { font-family: 'Cascadia Code', Consolas, monospace; font-size: 14px; fill: #2b3240; }
    .small { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #5b6472; }
    .step { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: 600; fill: #2b3240; }
    .section { font-family: 'Segoe UI', Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #14213d; }
    .num { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #ffffff; }
    .note { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .note-strong { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #14213d; }
  </style>
  <defs>
    <marker id="azul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="verde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="ambar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="900"/>

  <text class="title" x="60" y="62">Chaves do SSH: quem confere quem</text>
  <text class="subtitle" x="60" y="96">O servidor prova quem é; você prova quem é. A chave privada nunca sai do Windows.</text>

  <!-- Windows -->
  <rect class="card" x="80" y="130" width="440" height="190" rx="16"/>
  <rect x="80" y="130" width="440" height="52" rx="16" fill="#e8f0fe"/>
  <rect x="80" y="166" width="440" height="16" fill="#e8f0fe"/>
  <text class="host-title" x="104" y="164">Windows · cliente</text>
  <text class="host-sub" x="360" y="164">ssh rodrigo@rocky-lab</text>
  <rect x="104" y="200" width="190" height="96" rx="10" fill="#f8fafc" stroke="#dbe3ef"/>
  <text class="mini-title" x="118" y="224">Chave privada</text>
  <text class="mono" x="118" y="248">id_ed25519_lab</text>
  <text class="small" x="118" y="270">assina o desafio;</text>
  <text class="small" x="118" y="287">nunca sai daqui.</text>
  <rect x="310" y="200" width="190" height="96" rx="10" fill="#f8fafc" stroke="#dbe3ef"/>
  <text class="mini-title" x="324" y="224">known_hosts</text>
  <text class="mono" x="324" y="248">impressão digital</text>
  <text class="small" x="324" y="270">confere a chave</text>
  <text class="small" x="324" y="287">de host da VM.</text>

  <!-- VM -->
  <rect class="card" x="880" y="130" width="440" height="190" rx="16"/>
  <rect x="880" y="130" width="440" height="52" rx="16" fill="#e8f7ef"/>
  <rect x="880" y="166" width="440" height="16" fill="#e8f7ef"/>
  <text class="host-title" x="904" y="164">rocky-lab · sshd</text>
  <text class="host-sub" x="1130" y="164">servidor OpenSSH</text>
  <rect x="904" y="200" width="190" height="96" rx="10" fill="#f8fafc" stroke="#dbe3ef"/>
  <text class="mini-title" x="918" y="224">authorized_keys</text>
  <text class="mono" x="918" y="248">chave pública</text>
  <text class="small" x="918" y="270">a amostra que</text>
  <text class="small" x="918" y="287">confere a assinatura.</text>
  <rect x="1110" y="200" width="190" height="96" rx="10" fill="#f8fafc" stroke="#dbe3ef"/>
  <text class="mini-title" x="1124" y="224">Chave de host</text>
  <text class="mono" x="1124" y="248">ssh_host_*_key</text>
  <text class="small" x="1124" y="270">a identidade</text>
  <text class="small" x="1124" y="287">da própria VM.</text>

  <!-- Linhas do tempo -->
  <line x1="300" y1="320" x2="300" y2="800" stroke="#b9c2cf" stroke-width="1.5" stroke-dasharray="4 6"/>
  <line x1="1100" y1="320" x2="1100" y2="800" stroke="#b9c2cf" stroke-width="1.5" stroke-dasharray="4 6"/>

  <!-- Bloco 0 -->
  <text class="section" x="80" y="350">0 · uma vez, no começo</text>
  <line x1="300" y1="400" x2="1100" y2="400" stroke="#d97706" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#ambar)"/>
  <circle cx="700" cy="400" r="18" fill="#d97706"/>
  <text class="num" x="700" y="405" text-anchor="middle">0</text>
  <text class="step" x="700" y="378" text-anchor="middle">sua chave pública viaja para o authorized_keys</text>
  <text class="small" x="700" y="428" text-anchor="middle">só a pública viaja; a privada fica no Windows</text>

  <!-- Bloco 1-2 -->
  <text class="section" x="80" y="474">1–2 · o servidor prova quem é</text>
  <line x1="1100" y1="510" x2="300" y2="510" stroke="#2563eb" stroke-width="2.5" marker-end="url(#azul)"/>
  <circle cx="700" cy="510" r="18" fill="#2563eb"/>
  <text class="num" x="700" y="515" text-anchor="middle">1</text>
  <text class="step" x="700" y="488" text-anchor="middle">a VM apresenta a chave de host</text>

  <rect x="80" y="545" width="350" height="58" rx="10" fill="#e8f0fe" stroke="#bcd0f5"/>
  <circle cx="106" cy="574" r="15" fill="#2563eb"/>
  <text class="num" x="106" y="579" text-anchor="middle">2</text>
  <text class="step" x="132" y="570">known_hosts confere</text>
  <text class="small" x="132" y="589">a impressão digital fica guardada.</text>

  <!-- Bloco 3-5 -->
  <text class="section" x="80" y="644">3–5 · você prova quem é</text>
  <line x1="1100" y1="680" x2="300" y2="680" stroke="#059669" stroke-width="2.5" marker-end="url(#verde)"/>
  <circle cx="700" cy="680" r="18" fill="#059669"/>
  <text class="num" x="700" y="685" text-anchor="middle">3</text>
  <text class="step" x="700" y="658" text-anchor="middle">a VM manda um desafio novo</text>

  <line x1="300" y1="735" x2="1100" y2="735" stroke="#059669" stroke-width="2.5" marker-end="url(#verde)"/>
  <circle cx="700" cy="735" r="18" fill="#059669"/>
  <text class="num" x="700" y="740" text-anchor="middle">4</text>
  <text class="step" x="700" y="713" text-anchor="middle">o Windows assina o desafio com a privada</text>

  <rect x="1020" y="772" width="300" height="58" rx="10" fill="#e8f7ef" stroke="#b8e0c9"/>
  <circle cx="1046" cy="801" r="15" fill="#059669"/>
  <text class="num" x="1046" y="806" text-anchor="middle">5</text>
  <text class="step" x="1072" y="797">sshd confere a assinatura</text>
  <text class="small" x="1072" y="816">com a pública do authorized_keys.</text>

  <!-- Rodapé -->
  <rect x="60" y="850" width="1280" height="38" rx="10" fill="#ffffff" stroke="#d8d5cc"/>
  <text class="note" x="82" y="874"><tspan class="note-strong">Regra de ouro:</tspan> a privada assina, a pública confere. A privada fica no Windows; a pública pode circular. Confira a digital com ssh-keygen -lf.</text>
</svg>
