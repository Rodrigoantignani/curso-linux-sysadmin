<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="744" viewBox="0 0 1400 744" role="img" aria-labelledby="titulo desc">
  <title id="titulo">O Flatpak é um apartamento mobiliado</title>
  <desc id="desc">O prédio é a distro; o runtime é a mobília compartilhada; o app traz só o que é dele</desc>
  <style>
    .bg { fill: #f6f4ee; }
    .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 40px; font-weight: 700; fill: #14213d; }
    .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 19px; fill: #5b6472; }
    .h2 { font-family: 'Segoe UI', Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #14213d; }
    .card { fill: #ffffff; stroke: #d8d5cc; stroke-width: 1.5; }
    .step-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #14213d; }
    .step-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .small { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #5b6472; }
    .body { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #2b3240; }
    .mono { font-family: 'Cascadia Code', Consolas, monospace; font-size: 14px; fill: #2563eb; }
    .term { font-family: 'Cascadia Code', Consolas, monospace; font-size: 15px; fill: #e2e8f0; }
    .term-title { font-family: 'Cascadia Code', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #ffffff; }
    .num { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
    .foot { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .foot-strong { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #14213d; }
    .arrow { stroke: #8b93a1; stroke-width: 2.5; fill: none; }
    .tag { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b93a1"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="744"/>
  <text class="title" x="60" y="62">O Flatpak é um apartamento mobiliado</text>
  <text class="subtitle" x="60" y="98">O prédio é a distro; o runtime é a mobília compartilhada; o app traz só o que é dele</text>

  <rect class="card" x="60" y="156" width="780" height="86" rx="12"/>
  <rect x="60" y="156" width="10" height="86" rx="5" fill="#7c3aed"/>
  <text class="step-title" x="90" y="188" style="font-size:19px">Remote</text>
  <text class="small" x="90" y="211">A imobiliária: o Flathub ou outro repositório de aplicações.</text>
  <line class="arrow" x1="450" y1="242" x2="450" y2="254" marker-end="url(#seta)"/>
  <rect class="card" x="60" y="254" width="780" height="86" rx="12"/>
  <rect x="60" y="254" width="10" height="86" rx="5" fill="#7c3aed"/>
  <text class="step-title" x="90" y="286" style="font-size:19px">Download OSTree</text>
  <text class="small" x="90" y="309">Baixa só o que mudou, em vez do aplicativo inteiro.</text>
  <line class="arrow" x1="450" y1="340" x2="450" y2="352" marker-end="url(#seta)"/>
  <rect class="card" x="60" y="352" width="780" height="86" rx="12"/>
  <rect x="60" y="352" width="10" height="86" rx="5" fill="#7c3aed"/>
  <text class="step-title" x="90" y="384" style="font-size:19px">Runtime e app</text>
  <text class="small" x="90" y="407">O runtime traz as bibliotecas básicas; o app traz só o próprio programa.</text>
  <line class="arrow" x1="450" y1="438" x2="450" y2="450" marker-end="url(#seta)"/>
  <rect class="card" x="60" y="450" width="780" height="86" rx="12"/>
  <rect x="60" y="450" width="10" height="86" rx="5" fill="#7c3aed"/>
  <text class="step-title" x="90" y="482" style="font-size:19px">Sandbox</text>
  <text class="small" x="90" y="505">Dentro da caixa, /usr é o do runtime e /app é o app. Kernel e usuários são do host.</text>
  <line class="arrow" x1="450" y1="536" x2="450" y2="548" marker-end="url(#seta)"/>
  <rect class="card" x="60" y="548" width="780" height="86" rx="12"/>
  <rect x="60" y="548" width="10" height="86" rx="5" fill="#7c3aed"/>
  <text class="step-title" x="90" y="580" style="font-size:19px">Permissões</text>
  <text class="small" x="90" y="603">Rede, home e X11/Wayland só funcionam se a permissão deixar.</text>
  <rect class="card" x="880" y="156" width="460" height="390" rx="16"/>
  <rect x="880" y="156" width="8" height="390" rx="4" fill="#7c3aed"/>
  <text class="h2" x="908" y="194">No dia a dia</text>
  <circle cx="914" cy="225" r="6" fill="#7c3aed"/>
  <text class="body" x="932" y="230" style="font-weight:700">flatpak run</text>
  <text class="small" x="932" y="254">Roda o app dentro do sandbox, sem enxergar as</text>
  <text class="small" x="932" y="274">bibliotecas da distro.</text>
  <circle cx="914" cy="305" r="6" fill="#7c3aed"/>
  <text class="body" x="932" y="310" style="font-weight:700">flatpak override</text>
  <text class="small" x="932" y="334">Ajusta as portas do apartamento, por app.</text>
  <circle cx="914" cy="365" r="6" fill="#7c3aed"/>
  <text class="body" x="932" y="370" style="font-weight:700">Sistema ou usuário</text>
  <text class="small" x="932" y="394">A instalação vai para /var/lib/flatpak ou</text>
  <text class="small" x="932" y="414">~/.local/share/flatpak.</text>
  <circle cx="914" cy="445" r="6" fill="#7c3aed"/>
  <text class="body" x="932" y="450" style="font-weight:700">Quando faz sentido</text>
  <text class="small" x="932" y="474">Aplicativo gráfico e de desktop; num servidor, quase</text>
  <text class="small" x="932" y="494">nunca.</text>
  <line x1="60" y1="680" x2="1340" y2="680" stroke="#d8d5cc" stroke-width="1"/>
  <text class="foot" x="60" y="714">O app nunca enxerga o /usr da Rocky: é isso que o faz rodar igual em qualquer distro. Num servidor, o pacote nativo continua sendo a escolha.</text>
</svg>
