<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1026" viewBox="0 0 1400 1026" role="img" aria-labelledby="titulo desc">
  <title id="titulo">O roteiro &#x27;está lento&#x27;</title>
  <desc id="desc">Seis comandos, na ordem, e você já sabe onde olhar</desc>
  <style>
    .bg { fill: #f6f4ee; }
    .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 40px; font-weight: 700; fill: #14213d; }
    .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 19px; fill: #5b6472; }
    .h2 { font-family: 'Segoe UI', Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #14213d; }
    .card { fill: #ffffff; stroke: #d8d5cc; stroke-width: 1.5; }
    .step-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #14213d; }
    .step-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .small { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #5b6472; }
    .body { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #2b3240; }
    .mono { font-family: 'Cascadia Code', Consolas, monospace; font-size: 14px; fill: #2563eb; }
    .term { font-family: 'Cascadia Code', Consolas, monospace; font-size: 15px; fill: #e2e8f0; }
    .term-title { font-family: 'Cascadia Code', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #ffffff; }
    .num { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
    .foot { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .foot-strong { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #14213d; }
    .arrow { stroke: #8b93a1; stroke-width: 2.5; fill: none; }
    .tag { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b93a1"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="1026"/>
  <text class="title" x="60" y="62">O roteiro &#x27;está lento&#x27;</text>
  <text class="subtitle" x="60" y="98">Seis comandos, na ordem, e você já sabe onde olhar</text>

  <rect class="card" x="60" y="148" width="720" height="108" rx="14"/>
  <rect x="60" y="148" width="8" height="108" rx="4" fill="#dc2626"/>
  <circle cx="102" cy="202.0" r="19" fill="#dc2626"/>
  <text class="num" x="102" y="207.0" text-anchor="middle">1</text>
  <text class="step-title" x="136" y="186">1. uptime</text>
  <text class="step-sub" x="136" y="212">carga de 1, 5 e 15 min; compare com nproc</text>
  <line class="arrow" x1="420" y1="256" x2="420" y2="280" marker-end="url(#seta)"/>
  <rect class="card" x="60" y="280" width="720" height="108" rx="14"/>
  <rect x="60" y="280" width="8" height="108" rx="4" fill="#dc2626"/>
  <circle cx="102" cy="334.0" r="19" fill="#dc2626"/>
  <text class="num" x="102" y="339.0" text-anchor="middle">2</text>
  <text class="step-title" x="136" y="318">2. top -bn1</text>
  <text class="step-sub" x="136" y="344">us, wa, st na linha %Cpu(s)</text>
  <line class="arrow" x1="420" y1="388" x2="420" y2="412" marker-end="url(#seta)"/>
  <rect class="card" x="60" y="412" width="720" height="108" rx="14"/>
  <rect x="60" y="412" width="8" height="108" rx="4" fill="#dc2626"/>
  <circle cx="102" cy="466.0" r="19" fill="#dc2626"/>
  <text class="num" x="102" y="471.0" text-anchor="middle">3</text>
  <text class="step-title" x="136" y="450">3. free -h</text>
  <text class="step-sub" x="136" y="476">a coluna available, não a free</text>
  <line class="arrow" x1="420" y1="520" x2="420" y2="544" marker-end="url(#seta)"/>
  <rect class="card" x="60" y="544" width="720" height="108" rx="14"/>
  <rect x="60" y="544" width="8" height="108" rx="4" fill="#dc2626"/>
  <circle cx="102" cy="598.0" r="19" fill="#dc2626"/>
  <text class="num" x="102" y="603.0" text-anchor="middle">4</text>
  <text class="step-title" x="136" y="582">4. vmstat 1 5</text>
  <text class="step-sub" x="136" y="608">r fila, b presos em D, si/so swap</text>
  <line class="arrow" x1="420" y1="652" x2="420" y2="676" marker-end="url(#seta)"/>
  <rect class="card" x="60" y="676" width="720" height="108" rx="14"/>
  <rect x="60" y="676" width="8" height="108" rx="4" fill="#dc2626"/>
  <circle cx="102" cy="730.0" r="19" fill="#dc2626"/>
  <text class="num" x="102" y="735.0" text-anchor="middle">5</text>
  <text class="step-title" x="136" y="714">5. ps aux --sort</text>
  <text class="step-sub" x="136" y="740">o culpado de processador e de memória</text>
  <line class="arrow" x1="420" y1="784" x2="420" y2="808" marker-end="url(#seta)"/>
  <rect class="card" x="60" y="808" width="720" height="108" rx="14"/>
  <rect x="60" y="808" width="8" height="108" rx="4" fill="#dc2626"/>
  <circle cx="102" cy="862.0" r="19" fill="#dc2626"/>
  <text class="num" x="102" y="867.0" text-anchor="middle">6</text>
  <text class="step-title" x="136" y="846">6. journalctl -p warning</text>
  <text class="step-sub" x="136" y="872">o que o sistema reclamou na última hora</text>
  <rect class="card" x="820" y="148" width="520" height="270" rx="16"/>
  <rect x="820" y="148" width="8" height="270" rx="4" fill="#dc2626"/>
  <text class="h2" x="848" y="186">O que cada número diz</text>
  <circle cx="854" cy="217" r="6" fill="#dc2626"/>
  <text class="body" x="872" y="222" style="font-weight:700">carga alta + processador parado</text>
  <text class="small" x="872" y="246">o problema é disco ou rede (wa alto, processos em D)</text>
  <circle cx="854" cy="277" r="6" fill="#dc2626"/>
  <text class="body" x="872" y="282" style="font-weight:700">carga alta + processador cheio</text>
  <text class="small" x="872" y="306">é processo mesmo; ache o topo com ps aux --sort=-%cpu</text>
  <circle cx="854" cy="337" r="6" fill="#dc2626"/>
  <text class="body" x="872" y="342" style="font-weight:700">si/so acima de zero o tempo todo</text>
  <text class="small" x="872" y="366">memória curta: o sistema está swapando</text>
  <line x1="60" y1="962" x2="1340" y2="962" stroke="#d8d5cc" stroke-width="1"/>
  <text class="foot" x="60" y="996">Leia da primeira à sexta linha, sem pular. Um ping que não responde não prova que a máquina está fora; um firewall pode estar bloqueando ICMP.</text>
</svg>
