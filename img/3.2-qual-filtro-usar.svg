<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="752" viewBox="0 0 1400 752" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Qual filtro usar para cada tarefa</title>
  <desc id="desc">Cada filtro faz uma coisa só e entrega ao próximo</desc>
  <style>
    .bg { fill: #f6f4ee; }
    .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 40px; font-weight: 700; fill: #14213d; }
    .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 19px; fill: #5b6472; }
    .h2 { font-family: 'Segoe UI', Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #14213d; }
    .card { fill: #ffffff; stroke: #d8d5cc; stroke-width: 1.5; }
    .step-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #14213d; }
    .step-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .small { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #5b6472; }
    .body { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #2b3240; }
    .mono { font-family: 'Cascadia Code', Consolas, monospace; font-size: 14px; fill: #2563eb; }
    .term { font-family: 'Cascadia Code', Consolas, monospace; font-size: 15px; fill: #e2e8f0; }
    .term-title { font-family: 'Cascadia Code', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #ffffff; }
    .num { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
    .foot { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .foot-strong { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #14213d; }
    .arrow { stroke: #8b93a1; stroke-width: 2.5; fill: none; }
    .tag { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b93a1"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="752"/>
  <text class="title" x="60" y="62">Qual filtro usar para cada tarefa</text>
  <text class="subtitle" x="60" y="98">Cada filtro faz uma coisa só e entrega ao próximo</text>

  <rect class="card" x="60" y="156" width="409" height="230" rx="14"/>
  <rect x="60" y="156" width="409" height="10" rx="5" fill="#0891b2"/>
  <circle cx="94" cy="204" r="17" fill="#0891b2"/>
  <text class="num" x="94" y="209" text-anchor="middle">1</text>
  <text class="step-title" x="122" y="204" style="font-size:19px">grep</text>
  <text class="small" x="77" y="248">escolhe linhas que casam com um padrão — filtrar linhas</text>
  <rect class="card" x="495" y="156" width="409" height="230" rx="14"/>
  <rect x="495" y="156" width="409" height="10" rx="5" fill="#0891b2"/>
  <circle cx="529" cy="204" r="17" fill="#0891b2"/>
  <text class="num" x="529" y="209" text-anchor="middle">2</text>
  <text class="step-title" x="557" y="204" style="font-size:19px">sed</text>
  <text class="small" x="512" y="248">troca, apaga ou mostra linhas — transformar linhas</text>
  <rect class="card" x="931" y="156" width="409" height="230" rx="14"/>
  <rect x="931" y="156" width="409" height="10" rx="5" fill="#0891b2"/>
  <circle cx="965" cy="204" r="17" fill="#0891b2"/>
  <text class="num" x="965" y="209" text-anchor="middle">3</text>
  <text class="step-title" x="993" y="204" style="font-size:19px">awk</text>
  <text class="small" x="948" y="248">separa em campos e testa cada linha — colunas e contas</text>
  <rect class="card" x="60" y="412" width="409" height="230" rx="14"/>
  <rect x="60" y="412" width="409" height="10" rx="5" fill="#0891b2"/>
  <circle cx="94" cy="460" r="17" fill="#0891b2"/>
  <text class="num" x="94" y="465" text-anchor="middle">4</text>
  <text class="step-title" x="122" y="460" style="font-size:19px">cut</text>
  <text class="small" x="77" y="504">pega colunas por delimitador — um campo por linha</text>
  <rect class="card" x="495" y="412" width="409" height="230" rx="14"/>
  <rect x="495" y="412" width="409" height="10" rx="5" fill="#0891b2"/>
  <circle cx="529" cy="460" r="17" fill="#0891b2"/>
  <text class="num" x="529" y="465" text-anchor="middle">5</text>
  <text class="step-title" x="557" y="460" style="font-size:19px">sort</text>
  <text class="small" x="512" y="504">junta iguais em blocos — ordenar</text>
  <rect class="card" x="931" y="412" width="409" height="230" rx="14"/>
  <rect x="931" y="412" width="409" height="10" rx="5" fill="#0891b2"/>
  <circle cx="965" cy="460" r="17" fill="#0891b2"/>
  <text class="num" x="965" y="465" text-anchor="middle">6</text>
  <text class="step-title" x="993" y="460" style="font-size:19px">uniq</text>
  <text class="small" x="948" y="504">conta ou remove repetições vizinhas — contar blocos</text>
  <line x1="60" y1="688" x2="1340" y2="688" stroke="#d8d5cc" stroke-width="1"/>
  <text class="foot" x="60" y="722">Sem sort antes do uniq, o mesmo valor aparece em blocos separados e a contagem sai errada. Nenhum filtro altera o arquivo original.</text>
</svg>
