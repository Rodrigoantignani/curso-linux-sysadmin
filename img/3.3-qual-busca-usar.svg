<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="822" viewBox="0 0 1400 822" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Qual ferramenta de busca usar</title>
  <desc id="desc">O padrão casa um pedaço, não a linha toda</desc>
  <style>
    .bg { fill: #f6f4ee; }
    .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 40px; font-weight: 700; fill: #14213d; }
    .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 19px; fill: #5b6472; }
    .h2 { font-family: 'Segoe UI', Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #14213d; }
    .card { fill: #ffffff; stroke: #d8d5cc; stroke-width: 1.5; }
    .step-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #14213d; }
    .step-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .small { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #5b6472; }
    .body { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #2b3240; }
    .mono { font-family: 'Cascadia Code', Consolas, monospace; font-size: 14px; fill: #2563eb; }
    .term { font-family: 'Cascadia Code', Consolas, monospace; font-size: 15px; fill: #e2e8f0; }
    .term-title { font-family: 'Cascadia Code', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #ffffff; }
    .num { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
    .foot { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .foot-strong { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #14213d; }
    .arrow { stroke: #8b93a1; stroke-width: 2.5; fill: none; }
    .tag { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b93a1"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="822"/>
  <text class="title" x="60" y="62">Qual ferramenta de busca usar</text>
  <text class="subtitle" x="60" y="98">O padrão casa um pedaço, não a linha toda</text>

  <rect class="card" x="60" y="156" width="620" height="556" rx="16"/>
  <rect x="60" y="156" width="620" height="64" rx="16" fill="#7c3aed" opacity="0.10"/>
  <rect x="60" y="204" width="620" height="16" fill="#7c3aed" opacity="0.10"/>
  <text class="h2" x="84" y="196">grep</text>
  <text class="small" x="84" y="244">mostra a linha inteira que casa</text>
  <circle cx="90" cy="267" r="5" fill="#7c3aed"/>
  <text class="body" x="106" y="272" style="font-weight:700">-F</text>
  <text class="small" x="106" y="294">texto literal: o ponto vira ponto, não coringa</text>
  <circle cx="90" cy="322" r="5" fill="#7c3aed"/>
  <text class="body" x="106" y="327" style="font-weight:700">-w</text>
  <text class="small" x="106" y="349">palavra inteira: 10.1.0.20 não casa com 10.1.0.2</text>
  <circle cx="90" cy="377" r="5" fill="#7c3aed"/>
  <text class="body" x="106" y="382" style="font-weight:700">-i</text>
  <text class="small" x="106" y="404">ignora maiúsculas e minúsculas</text>
  <circle cx="90" cy="432" r="5" fill="#7c3aed"/>
  <text class="body" x="106" y="437" style="font-weight:700">-r</text>
  <text class="small" x="106" y="459">procura em todos os arquivos de uma pasta</text>
  <circle cx="90" cy="487" r="5" fill="#7c3aed"/>
  <text class="body" x="106" y="492" style="font-weight:700">-n</text>
  <text class="small" x="106" y="514">mostra o número da linha</text>
  <rect class="card" x="720" y="156" width="620" height="556" rx="16"/>
  <rect x="720" y="156" width="620" height="64" rx="16" fill="#7c3aed" opacity="0.10"/>
  <rect x="720" y="204" width="620" height="16" fill="#7c3aed" opacity="0.10"/>
  <text class="h2" x="744" y="196">Quando o grep não é suficiente</text>
  <text class="small" x="744" y="244">use outra ferramenta</text>
  <circle cx="750" cy="267" r="5" fill="#7c3aed"/>
  <text class="body" x="766" y="272" style="font-weight:700">sed</text>
  <text class="small" x="766" y="294">para trocar ou apagar linhas específicas</text>
  <circle cx="750" cy="322" r="5" fill="#7c3aed"/>
  <text class="body" x="766" y="327" style="font-weight:700">awk</text>
  <text class="small" x="766" y="349">para colunas, contas e somas</text>
  <circle cx="750" cy="377" r="5" fill="#7c3aed"/>
  <text class="body" x="766" y="382" style="font-weight:700">locate / find</text>
  <text class="small" x="766" y="404">para achar arquivos pelo nome, não pelo conteúdo</text>
  <circle cx="750" cy="432" r="5" fill="#7c3aed"/>
  <text class="body" x="766" y="437" style="font-weight:700">rg (ripgrep)</text>
  <text class="small" x="766" y="459">mais rápido que grep em pastas grandes</text>
  <line x1="60" y1="758" x2="1340" y2="758" stroke="#d8d5cc" stroke-width="1"/>
  <text class="foot" x="60" y="792">Antes de confiar no padrão, pergunte onde ele pode casar, o que cada caractere especial significa e se ele pode casar com nada.</text>
</svg>
