<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="496" viewBox="0 0 1400 496" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Os três bits especiais</title>
  <desc id="desc">O modo tem quatro dígitos em octal: o primeiro guarda setuid, setgid e sticky</desc>
  <style>
    .bg { fill: #f6f4ee; }
    .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 40px; font-weight: 700; fill: #14213d; }
    .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 19px; fill: #5b6472; }
    .h2 { font-family: 'Segoe UI', Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #14213d; }
    .card { fill: #ffffff; stroke: #d8d5cc; stroke-width: 1.5; }
    .step-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #14213d; }
    .step-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .small { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #5b6472; }
    .body { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #2b3240; }
    .mono { font-family: 'Cascadia Code', Consolas, monospace; font-size: 14px; fill: #2563eb; }
    .term { font-family: 'Cascadia Code', Consolas, monospace; font-size: 15px; fill: #e2e8f0; }
    .term-title { font-family: 'Cascadia Code', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #ffffff; }
    .num { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
    .foot { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .foot-strong { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #14213d; }
    .arrow { stroke: #8b93a1; stroke-width: 2.5; fill: none; }
    .tag { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b93a1"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="496"/>
  <text class="title" x="60" y="62">Os três bits especiais</text>
  <text class="subtitle" x="60" y="98">O modo tem quatro dígitos em octal: o primeiro guarda setuid, setgid e sticky</text>

  <rect class="card" x="60" y="156" width="409" height="230" rx="14"/>
  <rect x="60" y="156" width="409" height="10" rx="5" fill="#7c3aed"/>
  <circle cx="94" cy="204" r="17" fill="#7c3aed"/>
  <text class="num" x="94" y="209" text-anchor="middle">1</text>
  <text class="step-title" x="122" y="204" style="font-size:19px">setuid (4)</text>
  <text class="small" x="77" y="248">Num executável, roda com o UID do dono. Em pasta, o</text>
  <text class="small" x="77" y="267">Linux ignora. No ls -l aparece como s no lugar do x: rws</text>
  <text class="small" x="77" y="286">(bit + x) ou rwS (bit sem x).</text>
  <rect class="card" x="495" y="156" width="409" height="230" rx="14"/>
  <rect x="495" y="156" width="409" height="10" rx="5" fill="#7c3aed"/>
  <circle cx="529" cy="204" r="17" fill="#7c3aed"/>
  <text class="num" x="529" y="209" text-anchor="middle">2</text>
  <text class="step-title" x="557" y="204" style="font-size:19px">setgid (2)</text>
  <text class="small" x="512" y="248">Num executável, roda com o GID do grupo. Numa pasta,</text>
  <text class="small" x="512" y="267">todo arquivo novo herda o grupo dela. Aparece como s na</text>
  <text class="small" x="512" y="286">trinca do grupo.</text>
  <rect class="card" x="931" y="156" width="409" height="230" rx="14"/>
  <rect x="931" y="156" width="409" height="10" rx="5" fill="#7c3aed"/>
  <circle cx="965" cy="204" r="17" fill="#7c3aed"/>
  <text class="num" x="965" y="209" text-anchor="middle">3</text>
  <text class="step-title" x="993" y="204" style="font-size:19px">sticky (1)</text>
  <text class="small" x="948" y="248">Numa pasta, só o dono do arquivo apaga ou renomeia. É o</text>
  <text class="small" x="948" y="267">/tmp. Aparece como t (bit + x) ou T (bit sem x) na</text>
  <text class="small" x="948" y="286">trinca dos outros.</text>
  <line x1="60" y1="432" x2="1340" y2="432" stroke="#d8d5cc" stroke-width="1"/>
  <text class="foot" x="60" y="466">3770 = especiais 3 (setgid + sticky), dono 7, grupo 7, outros 0. E o link é só um nome que aponta para um inode; o inode aponta para os dados.</text>
</svg>
