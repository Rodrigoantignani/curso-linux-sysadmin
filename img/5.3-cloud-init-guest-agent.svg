<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="596" viewBox="0 0 1400 596" role="img" aria-labelledby="titulo desc">
  <title id="titulo">VM pronta para o dia a dia</title>
  <desc id="desc">cloud-init no primeiro boot; guest agent responde ao hipervisor</desc>
  <style>
    .bg { fill: #f6f4ee; }
    .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 40px; font-weight: 700; fill: #14213d; }
    .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 19px; fill: #5b6472; }
    .h2 { font-family: 'Segoe UI', Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #14213d; }
    .card { fill: #ffffff; stroke: #d8d5cc; stroke-width: 1.5; }
    .step-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #14213d; }
    .step-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .small { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #5b6472; }
    .body { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #2b3240; }
    .mono { font-family: 'Cascadia Code', Consolas, monospace; font-size: 14px; fill: #2563eb; }
    .term { font-family: 'Cascadia Code', Consolas, monospace; font-size: 15px; fill: #e2e8f0; }
    .term-title { font-family: 'Cascadia Code', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #ffffff; }
    .num { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
    .foot { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .foot-strong { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #14213d; }
    .arrow { stroke: #8b93a1; stroke-width: 2.5; fill: none; }
    .tag { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b93a1"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="596"/>
  <text class="title" x="60" y="62">VM pronta para o dia a dia</text>
  <text class="subtitle" x="60" y="98">cloud-init no primeiro boot; guest agent responde ao hipervisor</text>

  <rect class="card" x="60" y="176" width="300" height="300" rx="14"/>
  <rect x="60" y="176" width="300" height="10" rx="5" fill="#0891b2"/>
  <circle cx="90" cy="222" r="17" fill="#0891b2"/>
  <text class="num" x="90" y="227" text-anchor="middle">1</text>
  <text class="step-title" x="116" y="222" style="font-size:18px">cloud-init</text>
  <text class="small" x="76" y="272">nome, usuários e chaves SSH no primeiro</text>
  <text class="small" x="76" y="291">boot</text>
  <rect x="76" y="434" width="268" height="26" rx="13" fill="#0891b2" opacity="0.12"/>
  <text class="small" x="88" y="452" style="font-weight:700;fill:#0891b2">primeiro boot</text>
  <line class="arrow" x1="362" y1="326.0" x2="382" y2="326.0" marker-end="url(#seta)"/>
  <rect class="card" x="386" y="176" width="300" height="300" rx="14"/>
  <rect x="386" y="176" width="300" height="10" rx="5" fill="#0891b2"/>
  <circle cx="416" cy="222" r="17" fill="#0891b2"/>
  <text class="num" x="416" y="227" text-anchor="middle">2</text>
  <text class="step-title" x="442" y="222" style="font-size:18px">guest agent</text>
  <text class="small" x="402" y="272">responde ao Proxmox: IP, desligar,</text>
  <text class="small" x="402" y="291">informações</text>
  <rect x="402" y="434" width="268" height="26" rx="13" fill="#0891b2" opacity="0.12"/>
  <text class="small" x="414" y="452" style="font-weight:700;fill:#0891b2">interfone</text>
  <line class="arrow" x1="689" y1="326.0" x2="709" y2="326.0" marker-end="url(#seta)"/>
  <rect class="card" x="713" y="176" width="300" height="300" rx="14"/>
  <rect x="713" y="176" width="300" height="10" rx="5" fill="#0891b2"/>
  <circle cx="743" cy="222" r="17" fill="#0891b2"/>
  <text class="num" x="743" y="227" text-anchor="middle">3</text>
  <text class="step-title" x="769" y="222" style="font-size:18px">virtio</text>
  <text class="small" x="729" y="272">fala a língua do hipervisor em vez de</text>
  <text class="small" x="729" y="291">fingir hardware antigo</text>
  <rect x="729" y="434" width="268" height="26" rx="13" fill="#0891b2" opacity="0.12"/>
  <text class="small" x="741" y="452" style="font-weight:700;fill:#0891b2">desempenho</text>
  <line class="arrow" x1="1016" y1="326.0" x2="1036" y2="326.0" marker-end="url(#seta)"/>
  <rect class="card" x="1040" y="176" width="300" height="300" rx="14"/>
  <rect x="1040" y="176" width="300" height="10" rx="5" fill="#0891b2"/>
  <circle cx="1070" cy="222" r="17" fill="#0891b2"/>
  <text class="num" x="1070" y="227" text-anchor="middle">4</text>
  <text class="step-title" x="1096" y="222" style="font-size:18px">clone</text>
  <text class="small" x="1056" y="272">precisa de hostname, machine-id e chaves</text>
  <text class="small" x="1056" y="291">SSH novos</text>
  <rect x="1056" y="434" width="268" height="26" rx="13" fill="#0891b2" opacity="0.12"/>
  <text class="small" x="1068" y="452" style="font-weight:700;fill:#0891b2">cuidado</text>
  <line x1="60" y1="532" x2="1340" y2="532" stroke="#d8d5cc" stroke-width="1"/>
  <text class="foot" x="60" y="566">A VM tem kernel próprio; o contêiner usa o kernel do nó. A pergunta de decisão: preciso de outro kernel ou isolamento forte basta?</text>
</svg>
