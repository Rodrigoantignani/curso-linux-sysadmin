<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Famílias Linux: de onde vem cada sistema que você administra</title>
  <desc id="desc">O kernel Linux é a base. A família RHEL usa dnf e rpm e inclui Fedora, RHEL, Rocky, AlmaLinux e CentOS Stream. A família Debian usa apt e deb e inclui Ubuntu, Proxmox VE e a debian-lab. Outras famílias incluem Arch, openSUSE, OpenWrt e NethSecurity; o NethServer 8 não é distro, e sim aplicações em contêineres sobre Rocky ou Debian.</desc>
  <style>
    .bg { fill: #f6f4ee; }
    .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 42px; font-weight: 700; fill: #14213d; }
    .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; fill: #5b6472; }
    .kernel { fill: #14213d; }
    .kernel-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 27px; font-weight: 700; fill: #ffffff; }
    .kernel-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #cbd5e1; }
    .panel { fill: #ffffff; stroke: #d8d5cc; stroke-width: 1.5; }
    .family-rhel { font-family: 'Segoe UI', Arial, sans-serif; font-size: 28px; font-weight: 700; fill: #b91c1c; }
    .family-debian { font-family: 'Segoe UI', Arial, sans-serif; font-size: 28px; font-weight: 700; fill: #1d4ed8; }
    .family-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .box { fill: #f8fafc; stroke: #d8d5cc; stroke-width: 1.5; }
    .box-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #14213d; }
    .box-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #5b6472; }
    .box-small { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #5b6472; }
    .vm { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #ffffff; }
    .pill { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #ffffff; }
    .note { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .note-strong { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #14213d; }
    .arrow { stroke: #8b93a1; stroke-width: 2; fill: none; }
  </style>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b93a1"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="1000"/>

  <text class="title" x="60" y="62">Famílias Linux: de onde vem cada sistema</text>
  <text class="subtitle" x="60" y="96">O kernel é o motor; a distribuição é o carro. A família decide o gerenciador de pacotes.</text>

  <!-- Kernel -->
  <rect class="kernel" x="560" y="136" width="280" height="74" rx="16"/>
  <text class="kernel-title" x="700" y="170" text-anchor="middle">Kernel Linux</text>
  <text class="kernel-sub" x="700" y="194" text-anchor="middle">o mesmo motor para todas as distribuições</text>

  <path class="arrow" d="M640 210 C560 235, 430 245, 340 270" marker-end="url(#seta)"/>
  <path class="arrow" d="M760 210 C840 235, 970 245, 1060 270" marker-end="url(#seta)"/>

  <!-- Painel RHEL -->
  <rect class="panel" x="60" y="250" width="620" height="460" rx="16"/>
  <text class="family-rhel" x="90" y="292">Família RHEL</text>
  <text class="family-sub" x="90" y="316">pacotes .rpm · dnf / yum · ciclo de 10 anos</text>

  <rect class="box" x="240" y="336" width="260" height="58" rx="10"/>
  <text class="box-title" x="370" y="361" text-anchor="middle">Fedora</text>
  <text class="box-sub" x="370" y="381" text-anchor="middle">novidades primeiro; vida curta</text>

  <rect class="box" x="240" y="420" width="260" height="58" rx="10"/>
  <text class="box-title" x="370" y="445" text-anchor="middle">RHEL</text>
  <text class="box-sub" x="370" y="465" text-anchor="middle">o padrão comercial da Red Hat</text>

  <path class="arrow" d="M370 394 V414" marker-end="url(#seta)"/>

  <path class="arrow" d="M370 478 V496 H170 V514" marker-end="url(#seta)"/>
  <path class="arrow" d="M370 478 V496 H350 V514" marker-end="url(#seta)"/>
  <path class="arrow" d="M370 478 V496 H535 V514" marker-end="url(#seta)"/>

  <rect class="box" x="90" y="520" width="160" height="86" rx="10" stroke="#2563eb" stroke-width="3"/>
  <rect x="100" y="530" width="86" height="20" rx="10" fill="#2563eb"/>
  <text class="vm" x="143" y="544" text-anchor="middle">VM DO CURSO</text>
  <text class="box-title" x="170" y="570" text-anchor="middle">Rocky Linux 9</text>
  <text class="box-sub" x="170" y="590" text-anchor="middle">clone do RHEL</text>

  <rect class="box" x="270" y="520" width="160" height="86" rx="10"/>
  <text class="box-title" x="350" y="560" text-anchor="middle">AlmaLinux</text>
  <text class="box-sub" x="350" y="580" text-anchor="middle">outro clone do RHEL</text>

  <rect class="box" x="450" y="520" width="170" height="86" rx="10"/>
  <text class="box-title" x="535" y="560" text-anchor="middle">CentOS Stream</text>
  <text class="box-sub" x="535" y="580" text-anchor="middle">a versão que vem antes</text>

  <rect x="90" y="640" width="128" height="34" rx="17" fill="#b91c1c"/>
  <text class="pill" x="154" y="663" text-anchor="middle">dnf · rpm</text>

  <!-- Painel Debian -->
  <rect class="panel" x="720" y="250" width="620" height="460" rx="16"/>
  <text class="family-debian" x="750" y="292">Família Debian</text>
  <text class="family-sub" x="750" y="316">pacotes .deb · apt / dpkg · base comunitária</text>

  <rect class="box" x="900" y="336" width="260" height="58" rx="10"/>
  <text class="box-title" x="1030" y="361" text-anchor="middle">Debian</text>
  <text class="box-sub" x="1030" y="381" text-anchor="middle">estável, livre e comunitária</text>

  <path class="arrow" d="M1030 394 V410 H845 V424" marker-end="url(#seta)"/>
  <path class="arrow" d="M1030 394 V410 H1080 V424" marker-end="url(#seta)"/>

  <rect class="box" x="750" y="430" width="190" height="86" rx="10"/>
  <text class="box-title" x="845" y="470" text-anchor="middle">Ubuntu LTS</text>
  <text class="box-sub" x="845" y="490" text-anchor="middle">Debian + 5 anos</text>

  <rect class="box" x="970" y="430" width="220" height="86" rx="10"/>
  <text class="box-title" x="1080" y="470" text-anchor="middle">Proxmox VE</text>
  <text class="box-sub" x="1080" y="490" text-anchor="middle">Debian + kernel próprio</text>

  <path class="arrow" d="M845 516 V544" marker-end="url(#seta)"/>

  <rect class="box" x="750" y="550" width="190" height="86" rx="10" stroke="#2563eb" stroke-width="3"/>
  <rect x="760" y="560" width="86" height="20" rx="10" fill="#2563eb"/>
  <text class="vm" x="803" y="574" text-anchor="middle">VM DO CURSO</text>
  <text class="box-title" x="845" y="600" text-anchor="middle">Debian 13</text>
  <text class="box-sub" x="845" y="620" text-anchor="middle">debian-lab</text>

  <rect x="750" y="640" width="128" height="34" rx="17" fill="#1d4ed8"/>
  <text class="pill" x="814" y="663" text-anchor="middle">apt · deb</text>

  <!-- Outras famílias -->
  <rect class="panel" x="60" y="736" width="1280" height="154" rx="16"/>
  <text class="family-rhel" x="90" y="772" style="font-size:22px;fill:#14213d">Outras famílias</text>

  <rect class="box" x="90" y="792" width="280" height="68" rx="10"/>
  <text class="box-title" x="110" y="818">Arch Linux</text>
  <text class="box-sub" x="110" y="840">rolling release, sempre na ponta</text>

  <rect class="box" x="390" y="792" width="280" height="68" rx="10"/>
  <text class="box-title" x="410" y="818">openSUSE Tumbleweed</text>
  <text class="box-sub" x="410" y="840">rolling release com snapper</text>

  <rect class="box" x="690" y="792" width="280" height="68" rx="10"/>
  <text class="box-title" x="710" y="818">OpenWrt</text>
  <text class="box-sub" x="710" y="840">roteadores · origem do NethSecurity</text>

  <rect x="990" y="786" width="320" height="80" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 5"/>
  <text class="box-title" x="1010" y="812" fill="#6d28d9">NethServer 8</text>
  <text class="box-sub" x="1010" y="833">não é distro: aplicações em contêineres</text>
  <text class="box-sub" x="1010" y="852">por cima de Rocky ou Debian</text>

  <!-- Rodapé -->
  <text class="note" x="60" y="940"><tspan class="note-strong">Regra prática:</tspan> a família decide o comando. Na RHEL, dnf e .rpm; na Debian, apt e .deb. O kernel é o mesmo motor; a distribuição é o carro montado em volta dele.</text>
</svg>
