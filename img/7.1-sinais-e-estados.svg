<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="894" viewBox="0 0 1400 894" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Sinais e estados de um processo</title>
  <desc id="desc">Alguns sinais são pedidos ao programa; KILL e STOP são ordens executadas pelo kernel</desc>
  <style>
    .bg { fill: #f6f4ee; }
    .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 40px; font-weight: 700; fill: #14213d; }
    .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 19px; fill: #5b6472; }
    .h2 { font-family: 'Segoe UI', Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #14213d; }
    .card { fill: #ffffff; stroke: #d8d5cc; stroke-width: 1.5; }
    .step-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #14213d; }
    .step-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .small { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #5b6472; }
    .body { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #2b3240; }
    .mono { font-family: 'Cascadia Code', Consolas, monospace; font-size: 14px; fill: #2563eb; }
    .term { font-family: 'Cascadia Code', Consolas, monospace; font-size: 15px; fill: #e2e8f0; }
    .term-title { font-family: 'Cascadia Code', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #ffffff; }
    .num { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
    .foot { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .foot-strong { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #14213d; }
    .arrow { stroke: #8b93a1; stroke-width: 2.5; fill: none; }
    .tag { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b93a1"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="894"/>
  <text class="title" x="60" y="62">Sinais e estados de um processo</text>
  <text class="subtitle" x="60" y="98">Alguns sinais são pedidos ao programa; KILL e STOP são ordens executadas pelo kernel</text>

  <rect class="card" x="60" y="148" width="720" height="108" rx="14"/>
  <rect x="60" y="148" width="8" height="108" rx="4" fill="#7c3aed"/>
  <circle cx="102" cy="202.0" r="19" fill="#7c3aed"/>
  <text class="num" x="102" y="207.0" text-anchor="middle">1</text>
  <text class="step-title" x="136" y="186">TERM (15)</text>
  <text class="step-sub" x="136" y="212">Pedido de saída. O programa pode limpar e gravar. Sem tratamento, sai com</text>
  <text class="step-sub" x="136" y="233">143.</text>
  <line class="arrow" x1="420" y1="256" x2="420" y2="280" marker-end="url(#seta)"/>
  <rect class="card" x="60" y="280" width="720" height="108" rx="14"/>
  <rect x="60" y="280" width="8" height="108" rx="4" fill="#7c3aed"/>
  <circle cx="102" cy="334.0" r="19" fill="#7c3aed"/>
  <text class="num" x="102" y="339.0" text-anchor="middle">2</text>
  <text class="step-title" x="136" y="318">HUP (1)</text>
  <text class="step-sub" x="136" y="344">Muitos daemons releem a configuração. Quem não trata o sinal morre.</text>
  <line class="arrow" x1="420" y1="388" x2="420" y2="412" marker-end="url(#seta)"/>
  <rect class="card" x="60" y="412" width="720" height="108" rx="14"/>
  <rect x="60" y="412" width="8" height="108" rx="4" fill="#7c3aed"/>
  <circle cx="102" cy="466.0" r="19" fill="#7c3aed"/>
  <text class="num" x="102" y="471.0" text-anchor="middle">3</text>
  <text class="step-title" x="136" y="450">INT (2)</text>
  <text class="step-sub" x="136" y="476">O mesmo que Ctrl+C. Sem tratamento, sai com 130.</text>
  <line class="arrow" x1="420" y1="520" x2="420" y2="544" marker-end="url(#seta)"/>
  <rect class="card" x="60" y="544" width="720" height="108" rx="14"/>
  <rect x="60" y="544" width="8" height="108" rx="4" fill="#7c3aed"/>
  <circle cx="102" cy="598.0" r="19" fill="#7c3aed"/>
  <text class="num" x="102" y="603.0" text-anchor="middle">4</text>
  <text class="step-title" x="136" y="582">STOP (19) e CONT (18)</text>
  <text class="step-sub" x="136" y="608">O kernel congela o processo, que fica em T. CONT descongela.</text>
  <line class="arrow" x1="420" y1="652" x2="420" y2="676" marker-end="url(#seta)"/>
  <rect class="card" x="60" y="676" width="720" height="108" rx="14"/>
  <rect x="60" y="676" width="8" height="108" rx="4" fill="#7c3aed"/>
  <circle cx="102" cy="730.0" r="19" fill="#7c3aed"/>
  <text class="num" x="102" y="735.0" text-anchor="middle">5</text>
  <text class="step-title" x="136" y="714">KILL (9)</text>
  <text class="step-sub" x="136" y="740">O kernel elimina, sem limpeza. É o último degrau. Saída 137.</text>
  <rect class="card" x="820" y="148" width="520" height="330" rx="16"/>
  <rect x="820" y="148" width="8" height="330" rx="4" fill="#7c3aed"/>
  <text class="h2" x="848" y="186">Os estados</text>
  <circle cx="854" cy="217" r="6" fill="#7c3aed"/>
  <text class="body" x="872" y="222" style="font-weight:700">R e S</text>
  <text class="small" x="872" y="246">Rodando ou dormindo. S acorda quando recebe um sinal.</text>
  <circle cx="854" cy="277" r="6" fill="#7c3aed"/>
  <text class="body" x="872" y="282" style="font-weight:700">D</text>
  <text class="small" x="872" y="306">Preso em E/S. Nenhum sinal entra até a operação terminar.</text>
  <circle cx="854" cy="337" r="6" fill="#7c3aed"/>
  <text class="body" x="872" y="342" style="font-weight:700">T</text>
  <text class="small" x="872" y="366">Parado por STOP, Ctrl+Z ou leitura em segundo plano.</text>
  <circle cx="854" cy="397" r="6" fill="#7c3aed"/>
  <text class="body" x="872" y="402" style="font-weight:700">Z</text>
  <text class="small" x="872" y="426">Já terminou. Espera o pai ler a saída; trate o pai.</text>
  <line x1="60" y1="830" x2="1340" y2="830" stroke="#d8d5cc" stroke-width="1"/>
  <text class="foot" x="60" y="864">A ordem de sempre: TERM, espera, confere e só então KILL. Em serviço, use systemctl stop ou reload.</text>
</svg>
