<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="638" viewBox="0 0 1400 638" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Medir o boot com systemd-analyze</title>
  <desc id="desc">blame diz quem demorou; critical-chain diz quem fez esperar</desc>
  <style>
    .bg { fill: #f6f4ee; }
    .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 40px; font-weight: 700; fill: #14213d; }
    .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 19px; fill: #5b6472; }
    .h2 { font-family: 'Segoe UI', Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #14213d; }
    .card { fill: #ffffff; stroke: #d8d5cc; stroke-width: 1.5; }
    .step-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #14213d; }
    .step-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .small { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #5b6472; }
    .body { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #2b3240; }
    .mono { font-family: 'Cascadia Code', Consolas, monospace; font-size: 14px; fill: #2563eb; }
    .term { font-family: 'Cascadia Code', Consolas, monospace; font-size: 15px; fill: #e2e8f0; }
    .term-title { font-family: 'Cascadia Code', Consolas, monospace; font-size: 17px; font-weight: 700; fill: #ffffff; }
    .num { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
    .foot { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .foot-strong { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #14213d; }
    .arrow { stroke: #8b93a1; stroke-width: 2.5; fill: none; }
    .tag { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b93a1"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="638"/>
  <text class="title" x="60" y="62">Medir o boot com systemd-analyze</text>
  <text class="subtitle" x="60" y="98">blame diz quem demorou; critical-chain diz quem fez esperar</text>

  <rect class="card" x="60" y="156" width="620" height="372" rx="16"/>
  <rect x="60" y="156" width="620" height="64" rx="16" fill="#2563eb" opacity="0.10"/>
  <rect x="60" y="204" width="620" height="16" fill="#2563eb" opacity="0.10"/>
  <text class="h2" x="84" y="196">systemd-analyze blame</text>
  <text class="small" x="84" y="244">quem consumiu mais tempo</text>
  <circle cx="90" cy="267" r="5" fill="#2563eb"/>
  <text class="body" x="106" y="272" style="font-weight:700">ordem decrescente</text>
  <text class="small" x="106" y="294">o mais lento fica no topo</text>
  <circle cx="90" cy="322" r="5" fill="#2563eb"/>
  <text class="body" x="106" y="327" style="font-weight:700">seconds</text>
  <text class="small" x="106" y="349">tempo em segundos desde o boot</text>
  <circle cx="90" cy="377" r="5" fill="#2563eb"/>
  <text class="body" x="106" y="382" style="font-weight:700">milhares de ms</text>
  <text class="small" x="106" y="404">cada serviço conta</text>
  <rect class="card" x="720" y="156" width="620" height="372" rx="16"/>
  <rect x="720" y="156" width="620" height="64" rx="16" fill="#2563eb" opacity="0.10"/>
  <rect x="720" y="204" width="620" height="16" fill="#2563eb" opacity="0.10"/>
  <text class="h2" x="744" y="196">systemd-analyze critical-chain</text>
  <text class="small" x="744" y="244">a corrente que atrasa o boot</text>
  <circle cx="750" cy="267" r="5" fill="#2563eb"/>
  <text class="body" x="766" y="272" style="font-weight:700">quem espera quem</text>
  <text class="small" x="766" y="294">A deve subir antes de B</text>
  <circle cx="750" cy="322" r="5" fill="#2563eb"/>
  <text class="body" x="766" y="327" style="font-weight:700">o ponto crítico</text>
  <text class="small" x="766" y="349">o serviço mais lento no caminho</text>
  <circle cx="750" cy="377" r="5" fill="#2563eb"/>
  <text class="body" x="766" y="382" style="font-weight:700">tempo acumulado</text>
  <text class="small" x="766" y="404">soma da cadeia inteira</text>
  <line x1="60" y1="574" x2="1340" y2="574" stroke="#d8d5cc" stroke-width="1"/>
  <text class="foot" x="60" y="588">Compare o topo do blame com a corrente do critical-chain. Muitas vezes são units diferentes: o blame diz quem demorou, o critical-chain diz quem fez o</text>
  <text class="foot" x="60" y="608">boot esperar.</text>
</svg>
