<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1120" viewBox="0 0 1400 1120" role="img" aria-labelledby="titulo desc">
  <title id="titulo">A ordem de busca do bash: o que acontece entre o Enter e a execução</title>
  <desc id="desc">Ao apertar Enter, o bash consulta seis etapas em ordem: alias, palavra reservada, função, builtin, tabela hash e os diretórios do PATH. Quem responde primeiro vence. Se ninguém responder, aparece command not found. As etapas 1 a 4 não dependem de arquivo em disco; por isso, com o PATH quebrado, echo e cd ainda funcionam e ls não.</desc>
  <style>
    .bg { fill: #f6f4ee; }
    .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 40px; font-weight: 700; fill: #14213d; }
    .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 19px; fill: #5b6472; }
    .enter { fill: #14213d; }
    .enter-title { font-family: 'Cascadia Code', Consolas, monospace; font-size: 22px; font-weight: 700; fill: #ffffff; }
    .enter-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #cbd5e1; }
    .step-box { fill: #ffffff; stroke: #d8d5cc; stroke-width: 1.5; }
    .step-num { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #ffffff; }
    .step-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #14213d; }
    .step-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .step-code { font-family: 'Cascadia Code', Consolas, monospace; font-size: 14px; fill: #2563eb; }
    .win { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #ffffff; }
    .found { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #059669; }
    .fail { fill: #b91c1c; }
    .fail-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #ffffff; }
    .fail-sub { font-family: 'Cascadia Code', Consolas, monospace; font-size: 15px; fill: #fee2e2; }
    .arrow { stroke: #8b93a1; stroke-width: 2.5; fill: none; }
    .arrow-red { stroke: #b91c1c; stroke-width: 2.5; fill: none; }
    .side { fill: #ffffff; stroke: #d8d5cc; stroke-width: 1.5; }
    .side-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #14213d; }
    .side-body { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #2b3240; }
    .side-code { font-family: 'Cascadia Code', Consolas, monospace; font-size: 14px; fill: #2563eb; }
    .num-small { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; }
    .note { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .note-strong { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #14213d; }
  </style>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b93a1"/>
    </marker>
    <marker id="seta-vermelha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="1120"/>

  <text class="title" x="60" y="62">A ordem de busca do bash</text>
  <text class="subtitle" x="60" y="96">Entre o Enter e a execução: seis perguntas, sempre na mesma ordem. Quem responde primeiro vence.</text>

  <!-- Enter -->
  <rect class="enter" x="60" y="128" width="560" height="66" rx="14"/>
  <text class="enter-title" x="86" y="158">$ ll /var/log</text>
  <text class="enter-sub" x="86" y="180">Enter pressionado · o bash lê a linha e começa a procurar</text>
  <path class="arrow" d="M340 194 V222" marker-end="url(#seta)"/>

  <!-- Etapa 1 -->
  <rect class="step-box" x="60" y="228" width="560" height="92" rx="14"/>
  <rect x="60" y="228" width="8" height="92" rx="4" fill="#2563eb"/>
  <circle cx="100" cy="274" r="18" fill="#2563eb"/>
  <text class="step-num" x="100" y="281" text-anchor="middle">1</text>
  <text class="step-title" x="132" y="266">Alias</text>
  <text class="step-sub" x="132" y="290">um apelido definido nesta sessão troca a palavra por outra</text>
  <text class="step-code" x="132" y="310">ll → ls -l --color=auto</text>
  <rect x="488" y="248" width="112" height="24" rx="12" fill="#64748b"/>
  <text class="win" x="544" y="264" text-anchor="middle">Get-Command</text>

  <path class="arrow" d="M340 320 V348" marker-end="url(#seta)"/>
  <text class="note" x="350" y="340">não é alias</text>

  <!-- Etapa 2 -->
  <rect class="step-box" x="60" y="354" width="560" height="82" rx="14"/>
  <rect x="60" y="354" width="8" height="82" rx="4" fill="#7c3aed"/>
  <circle cx="100" cy="395" r="18" fill="#7c3aed"/>
  <text class="step-num" x="100" y="402" text-anchor="middle">2</text>
  <text class="step-title" x="132" y="388">Palavra reservada</text>
  <text class="step-sub" x="132" y="412">a língua do próprio bash: <tspan class="step-code">if</tspan>, <tspan class="step-code">for</tspan>, <tspan class="step-code">while</tspan>, <tspan class="step-code">case</tspan>, <tspan class="step-code">[[</tspan></text>

  <path class="arrow" d="M340 436 V464" marker-end="url(#seta)"/>

  <!-- Etapa 3 -->
  <rect class="step-box" x="60" y="470" width="560" height="82" rx="14"/>
  <rect x="60" y="470" width="8" height="82" rx="4" fill="#059669"/>
  <circle cx="100" cy="511" r="18" fill="#059669"/>
  <text class="step-num" x="100" y="518" text-anchor="middle">3</text>
  <text class="step-title" x="132" y="504">Função</text>
  <text class="step-sub" x="132" y="528">um bloco criado nesta sessão ou herdado do ambiente</text>

  <path class="arrow" d="M340 552 V580" marker-end="url(#seta)"/>

  <!-- Etapa 4 -->
  <rect class="step-box" x="60" y="586" width="560" height="82" rx="14"/>
  <rect x="60" y="586" width="8" height="82" rx="4" fill="#d97706"/>
  <circle cx="100" cy="627" r="18" fill="#d97706"/>
  <text class="step-num" x="100" y="634" text-anchor="middle">4</text>
  <text class="step-title" x="132" y="620">Builtin</text>
  <text class="step-sub" x="132" y="644">embutido no bash, sem arquivo em disco: <tspan class="step-code">cd</tspan>, <tspan class="step-code">echo</tspan>, <tspan class="step-code">type</tspan>, <tspan class="step-code">history</tspan></text>

  <path class="arrow" d="M340 668 V696" marker-end="url(#seta)"/>

  <!-- Etapa 5 -->
  <rect class="step-box" x="60" y="702" width="560" height="82" rx="14"/>
  <rect x="60" y="702" width="8" height="82" rx="4" fill="#0891b2"/>
  <circle cx="100" cy="743" r="18" fill="#0891b2"/>
  <text class="step-num" x="100" y="750" text-anchor="middle">5</text>
  <text class="step-title" x="132" y="736">Tabela hash</text>
  <text class="step-sub" x="132" y="760">o caminho já achado nesta sessão; <tspan class="step-code">hash -r</tspan> manda esquecer</text>

  <path class="arrow" d="M340 784 V812" marker-end="url(#seta)"/>

  <!-- Etapa 6 -->
  <rect class="step-box" x="60" y="818" width="560" height="104" rx="14"/>
  <rect x="60" y="818" width="8" height="104" rx="4" fill="#dc2626"/>
  <circle cx="100" cy="870" r="18" fill="#dc2626"/>
  <text class="step-num" x="100" y="877" text-anchor="middle">6</text>
  <text class="step-title" x="132" y="860">PATH, diretório por diretório</text>
  <text class="step-code" x="132" y="888">/usr/local/bin : /usr/bin : /usr/local/sbin : /usr/sbin</text>
  <text class="step-sub" x="132" y="910">o primeiro arquivo executável com esse nome vence</text>

  <path class="arrow-red" d="M340 922 V952" marker-end="url(#seta-vermelha)"/>

  <!-- Falha -->
  <rect class="fail" x="60" y="958" width="560" height="92" rx="14"/>
  <text class="fail-title" x="88" y="990">command not found</text>
  <text class="fail-sub" x="88" y="1016">ninguém respondeu nas seis etapas</text>
  <text class="fail-sub" x="88" y="1037">o programa pode existir fora do PATH</text>

  <!-- Painel lateral: as três consequências -->
  <rect class="side" x="700" y="228" width="640" height="370" rx="16"/>
  <text class="side-title" x="730" y="268">O que o diagrama explica</text>

  <circle cx="744" cy="308" r="12" fill="#dc2626"/>
  <text class="num-small" x="744" y="313" text-anchor="middle">1</text>
  <text class="side-body" x="766" y="304"><tspan style="font-weight:700">command not found ≠ não instalado.</tspan></text>
  <text class="side-body" x="766" y="326">O programa pode estar em <tspan class="side-code">/usr/sbin</tspan>, fora do PATH,</text>
  <text class="side-body" x="766" y="348">ou o PATH pode estar quebrado.</text>

  <circle cx="744" cy="394" r="12" fill="#2563eb"/>
  <text class="num-small" x="744" y="399" text-anchor="middle">2</text>
  <text class="side-body" x="766" y="390"><tspan style="font-weight:700">O primeiro que aparece vence.</tspan></text>
  <text class="side-body" x="766" y="412">Um <tspan class="side-code">ls</tspan> falso em <tspan class="side-code">~/bin</tspan> ganha do verdadeiro</text>
  <text class="side-body" x="766" y="434">em <tspan class="side-code">/usr/bin</tspan>. Por isso o PATH do root não</text>
  <text class="side-body" x="766" y="456">inclui o diretório atual.</text>

  <circle cx="744" cy="502" r="12" fill="#059669"/>
  <text class="num-small" x="744" y="507" text-anchor="middle">3</text>
  <text class="side-body" x="766" y="498"><tspan style="font-weight:700">A anotação pode ficar velha.</tspan></text>
  <text class="side-body" x="766" y="520">Se o programa muda de lugar, o bash continua</text>
  <text class="side-body" x="766" y="542">indo ao caminho antigo até <tspan class="side-code">hash -r</tspan>.</text>

  <text class="note" x="730" y="578">Use <tspan class="note-strong">type -a ls</tspan> para ver todas as respostas, na ordem.</text>

  <!-- Painel lateral: PATH quebrado -->
  <rect class="side" x="700" y="626" width="640" height="424" rx="16"/>
  <rect x="700" y="626" width="8" height="424" rx="4" fill="#d97706"/>
  <text class="side-title" x="730" y="666">O teste de cinco segundos</text>
  <text class="side-body" x="730" y="698">Com o PATH quebrado, as etapas 1 a 4 continuam</text>
  <text class="side-body" x="730" y="720">respondendo: elas não dependem de arquivo em disco.</text>

  <rect x="730" y="748" width="580" height="70" rx="10" fill="#f0fdf4" stroke="#b8e0c9"/>
  <text class="side-code" x="750" y="778" fill="#059669">$ echo ok</text>
  <text class="side-code" x="750" y="802" fill="#059669">ok</text>
  <text class="side-body" x="930" y="792">builtin: o bash responde sozinho</text>

  <rect x="730" y="834" width="580" height="70" rx="10" fill="#fef2f2" stroke="#f5c2c2"/>
  <text class="side-code" x="750" y="864" fill="#b91c1c">$ ls</text>
  <text class="side-code" x="750" y="888" fill="#b91c1c">bash: ls: command not found</text>
  <text class="side-body" x="1000" y="872">externo: depende do PATH</text>

  <text class="side-body" x="730" y="944">Se <tspan class="side-code">echo</tspan> responde e <tspan class="side-code">ls</tspan> não, o bash está vivo:</text>
  <text class="side-body" x="730" y="966">o problema é o PATH. Conserte com o caminho completo,</text>
  <text class="side-body" x="730" y="988">como <tspan class="side-code">/usr/bin/vi</tspan>, sem fechar a sessão que funciona.</text>
  <text class="note" x="730" y="1022">Ponte Windows: no PowerShell a ordem é alias, função, cmdlet e <tspan class="note-strong">$env:Path</tspan>.</text>

  <!-- Rodapé -->
  <text class="note" x="60" y="1090"><tspan class="note-strong">Regra de ouro:</tspan> o bash não procura no diretório atual. Para rodar um script da pasta, escreva <tspan class="note-strong">./script.sh</tspan>.</text>
</svg>
