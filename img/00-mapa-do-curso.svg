<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Mapa do Curso Linux Sysadmin: quatro fases, seis provas e 46 semanas</title>
  <desc id="desc">Linha do tempo do curso, com as fases Fundamentos, Administrador, Engenheiro e Profissional; as provas Linux Essentials, LPIC-1 101, LPIC-1 102, RHCSA, EX294 e EX342; e a faixa já publicada neste repositório, de M0 a M6.</desc>
  <style>
    .bg { fill: #f6f4ee; }
    .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 44px; font-weight: 700; fill: #14213d; }
    .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 21px; fill: #5b6472; }
    .phase { font-family: 'Segoe UI', Arial, sans-serif; font-size: 25px; font-weight: 700; fill: #14213d; }
    .phase-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #5b6472; }
    .bar-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #ffffff; }
    .week { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #7a8290; }
    .note { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; fill: #5b6472; }
    .note-strong { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #2563eb; }
    .legend { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #2b3240; }
    .legend-strong { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #14213d; }
    .pill { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #14213d; }
    .num { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
    .grid { stroke: #d9d5ca; stroke-width: 1; stroke-dasharray: 3 6; }
    .boundary { stroke: #c7c2b5; stroke-width: 1; }
  </style>

  <rect class="bg" x="0" y="0" width="1400" height="900"/>

  <!-- Cabeçalho -->
  <text class="title" x="60" y="66">Curso Linux Sysadmin</text>
  <text class="subtitle" x="60" y="102">4 fases · 6 provas · 46 semanas · 155 aulas · do zero ao RHCE</text>

  <rect x="1050" y="34" width="290" height="58" rx="14" fill="#ffffff" stroke="#d8d5cc"/>
  <text class="pill" x="1070" y="58">Início: 2 nov 2026</text>
  <text class="pill" x="1070" y="79">Fim previsto: outubro de 2027</text>

  <!-- Faixa do que já está publicado -->
  <rect x="250" y="228" width="240" height="438" rx="8" fill="#2563eb" opacity="0.06"/>

  <!-- Grade de semanas -->
  <line class="grid" x1="250" y1="232" x2="250" y2="666"/>
  <line class="grid" x1="391" y1="232" x2="391" y2="666"/>
  <line class="grid" x1="592" y1="232" x2="592" y2="666"/>
  <line class="grid" x1="780" y1="232" x2="780" y2="666"/>
  <line class="grid" x1="827" y1="232" x2="827" y2="666"/>
  <line class="grid" x1="839" y1="232" x2="839" y2="666"/>
  <line class="grid" x1="1063" y1="232" x2="1063" y2="666"/>
  <line class="grid" x1="1074" y1="232" x2="1074" y2="666"/>
  <line class="grid" x1="1310" y1="232" x2="1310" y2="666"/>

  <text class="week" x="250" y="222" text-anchor="middle">1</text>
  <text class="week" x="391" y="222" text-anchor="middle">7</text>
  <text class="week" x="592" y="222" text-anchor="middle">15</text>
  <text class="week" x="780" y="222" text-anchor="middle">23</text>
  <text class="week" x="827" y="222" text-anchor="middle">25</text>
  <text class="week" x="839" y="222" text-anchor="middle">26</text>
  <text class="week" x="1063" y="222" text-anchor="middle">35</text>
  <text class="week" x="1074" y="222" text-anchor="middle">36</text>
  <text class="week" x="1310" y="222" text-anchor="middle">46</text>

  <!-- Fase 1 -->
  <text class="phase" x="60" y="272">Fase 1</text>
  <text class="phase-sub" x="60" y="296">Fundamentos · 20 aulas</text>
  <text class="phase-sub" x="60" y="317">semanas 1–6</text>
  <rect x="250" y="250" width="141" height="60" rx="12" fill="#2563eb"/>
  <text class="bar-label" x="320" y="287" text-anchor="middle">M0–M2</text>
  <line x1="380" y1="310" x2="380" y2="328" stroke="#2563eb" stroke-width="2"/>
  <circle cx="380" cy="345" r="17" fill="#2563eb" stroke="#f6f4ee" stroke-width="3"/>
  <text class="num" x="380" y="351" text-anchor="middle">1</text>

  <!-- Fase 2 -->
  <text class="phase" x="60" y="382">Fase 2</text>
  <text class="phase-sub" x="60" y="406">Administrador · 63 aulas</text>
  <text class="phase-sub" x="60" y="427">semanas 7–25</text>
  <rect x="391" y="360" width="448" height="60" rx="12" fill="#7c3aed"/>
  <text class="bar-label" x="615" y="397" text-anchor="middle">M3–M16</text>

  <line x1="592" y1="420" x2="592" y2="438" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="592" cy="455" r="17" fill="#7c3aed" stroke="#f6f4ee" stroke-width="3"/>
  <text class="num" x="592" y="461" text-anchor="middle">2</text>

  <line x1="780" y1="420" x2="780" y2="438" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="780" cy="455" r="17" fill="#7c3aed" stroke="#f6f4ee" stroke-width="3"/>
  <text class="num" x="780" y="461" text-anchor="middle">3</text>

  <line x1="827" y1="420" x2="827" y2="438" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="827" cy="455" r="17" fill="#7c3aed" stroke="#f6f4ee" stroke-width="3"/>
  <text class="num" x="827" y="461" text-anchor="middle">4</text>

  <!-- Fase 3 -->
  <text class="phase" x="60" y="492">Fase 3</text>
  <text class="phase-sub" x="60" y="516">Engenheiro · 34 aulas</text>
  <text class="phase-sub" x="60" y="537">semanas 26–35</text>
  <rect x="839" y="470" width="236" height="60" rx="12" fill="#059669"/>
  <text class="bar-label" x="957" y="507" text-anchor="middle">M17–M22</text>

  <line x1="1063" y1="530" x2="1063" y2="548" stroke="#059669" stroke-width="2"/>
  <circle cx="1063" cy="565" r="17" fill="#059669" stroke="#f6f4ee" stroke-width="3"/>
  <text class="num" x="1063" y="571" text-anchor="middle">5</text>

  <!-- Fase 4 -->
  <text class="phase" x="60" y="602">Fase 4</text>
  <text class="phase-sub" x="60" y="626">Profissional · 38 aulas</text>
  <text class="phase-sub" x="60" y="647">semanas 36–46</text>
  <rect x="1074" y="580" width="259" height="60" rx="12" fill="#d97706"/>
  <text class="bar-label" x="1204" y="617" text-anchor="middle">M23–M30</text>

  <line x1="1310" y1="640" x2="1310" y2="658" stroke="#d97706" stroke-width="2"/>
  <circle cx="1310" cy="675" r="17" fill="#d97706" stroke="#f6f4ee" stroke-width="3"/>
  <text class="num" x="1310" y="681" text-anchor="middle">6</text>

  <!-- Chave do que já está publicado -->
  <path d="M250 700 v-12 H490 v12" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text class="note-strong" x="370" y="724" text-anchor="middle">37 aulas publicadas aqui (M0–M6)</text>
  <text class="note" x="370" y="744" text-anchor="middle">semanas 1–11</text>

  <!-- Legenda das provas -->
  <line x1="60" y1="770" x2="1340" y2="770" stroke="#d8d5cc" stroke-width="1"/>

  <circle cx="78" cy="800" r="13" fill="#2563eb"/>
  <text class="num" x="78" y="805" text-anchor="middle">1</text>
  <text class="legend-strong" x="100" y="805">Linux Essentials 010-200</text>
  <text class="legend" x="100" y="824">semana 6 · prova neutra</text>

  <circle cx="478" cy="800" r="13" fill="#7c3aed"/>
  <text class="num" x="478" y="805" text-anchor="middle">2</text>
  <text class="legend-strong" x="500" y="805">LPIC-1 101-500</text>
  <text class="legend" x="500" y="824">semana 15 · prova neutra</text>

  <circle cx="878" cy="800" r="13" fill="#7c3aed"/>
  <text class="num" x="878" y="805" text-anchor="middle">3</text>
  <text class="legend-strong" x="900" y="805">LPIC-1 102-500</text>
  <text class="legend" x="900" y="824">semana 23 · prova neutra</text>

  <circle cx="78" cy="850" r="13" fill="#7c3aed"/>
  <text class="num" x="78" y="855" text-anchor="middle">4</text>
  <text class="legend-strong" x="100" y="855">RHCSA EX200</text>
  <text class="legend" x="100" y="874">semana 25 · prática</text>

  <circle cx="478" cy="850" r="13" fill="#059669"/>
  <text class="num" x="478" y="855" text-anchor="middle">5</text>
  <text class="legend-strong" x="500" y="855">EX294 · RHCE Ansible</text>
  <text class="legend" x="500" y="874">semana 35 · prática</text>

  <circle cx="878" cy="850" r="13" fill="#d97706"/>
  <text class="num" x="878" y="855" text-anchor="middle">6</text>
  <text class="legend-strong" x="900" y="855">EX342 · RHCE Enterprise Linux</text>
  <text class="legend" x="900" y="874">semana 46 · prática</text>
</svg>
